  <!-- phone -->
  <path class="icon" transform="translate(375 120) scale(.82)" d="M1904 1024l90-46 89 177-79 40c39 78 100 140 179 179l40-79 177 89-46 90c-27 54-88 82-146 65-185-53-330-199-384-384-17-58 11-119 65-146z"/>
