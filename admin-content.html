<script id="sk-local-core-v2627">(function(){'use strict';const API_BASE='https://sk-alumni-api.itpcmc2024.workers.dev';window.SK=window.SK||{API:API_BASE,VERSION:'V2.6.27'};window.e=window.e||function(v){return String(v??'').replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]||c})};window.api=window.api||async function(path,opts={}){const r=await fetch(API_BASE+path,{cache:'no-store',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok||j.success===false){const er=new Error(j.message||j.error||('HTTP '+r.status));er.status=r.status;throw er}return j};window.fmtDate=window.fmtDate||function(v){if(!v)return'-';try{return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return String(v)}};window.footer=window.footer||function(moduleName){return '<footer class="footer"><div class="wrap footin"><div class="footbrand"><img src="assets/association-logo.png"><div><b style="color:#086a4b">สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</b><div style="font-size:12px;color:#748396">🌙 Nurul Islam · สานสัมพันธ์ศิษย์เก่า</div></div></div><div class="footcopy">© 2026 SK Alumni Member System by Kimhan · '+e(moduleName)+' V2.6.27</div></div></footer>'};window.$id=window.$id||function(id){return document.getElementById(id)}})();</script></head><body><div id="sk-v2627-marker" style="display:none">V2.6.27</div>
<div class="v26-homebar"><a class="v26-homebtn" href="index.html">← กลับหน้าหลัก</a></div>

<header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">จัดการข่าวสาร</div><div class="brand-sub">Admin · V2.6.27</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a><a class="active">ข่าวสาร</a></nav></div></header><main class="wrap"><div class="subtabs"><button class="subtab active" data-p="edit">✍️ เพิ่มข่าว</button><button class="subtab" data-p="list">📋 รายการข่าว</button></div><div id="cp-edit" class="subpanel"><div class="card" style="margin-top:0"><form id="f" class="form"><div class="row2"><div class="field"><label>Admin API Key *</label><input id="key" class="control" type="password" required></div><div class="field"><label>หมวด *</label><select id="cat" class="control"><option>ข่าวสาร</option><option>ประกาศ</option><option>กิจกรรม</option></select></div></div><div class="field"><label>หัวข้อ *</label><input id="title" class="control" required></div><div class="field"><label>เนื้อหา *</label><textarea id="content" class="control" required></textarea></div><button class="btn">บันทึกข่าว</button></form></div></div><div id="cp-list" class="subpanel" hidden><h2 class="section-title">รายการข่าว</h2><div id="list" class="list"></div></div></main><div id="foot"></div><script>document.getElementById('foot').innerHTML=footer('Admin Content');async function refresh(){try{const j=await api('/api/news');document.getElementById('list').innerHTML=(j.data||[]).map(n=>`<div class="item"><b>${e(n.title)}</b> <span class="badge active">${e(n.category)}</span><div class="sub">${fmtDate(n.publish_date)}</div></div>`).join('')||'<div class="item">ยังไม่มีข่าว</div>'}catch(err){document.getElementById('list').innerHTML='<div class="item">'+e(err.message)+'</div>'}}document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/news',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()},body:JSON.stringify({category:cat.value,title:title.value.trim(),content:content.value.trim()})});Swal.fire({icon:'success',title:'บันทึกแล้ว',timer:900,showConfirmButton:false});title.value='';content.value='';refresh()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subtab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.subpanel').forEach(x=>x.hidden=x.id!=='cp-'+b.dataset.p)});refresh();</script>
<script id="sk-id-bridge-v2627">document.addEventListener('DOMContentLoaded',()=>{if(document.getElementById('f')) window['f']=document.getElementById('f');if(document.getElementById('list')) window['list']=document.getElementById('list');if(document.getElementById('key')) window['key']=document.getElementById('key');if(document.getElementById('refresh')) window['refresh']=document.getElementById('refresh');if(document.getElementById('forget')) window['forget']=document.getElementById('forget');},{once:true});</script></body></html>
