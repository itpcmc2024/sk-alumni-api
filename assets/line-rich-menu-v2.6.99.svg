<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <style>
    .title{font:700 82px Sarabun,"Noto Sans Thai",sans-serif;fill:#075E43;text-anchor:middle}
    .sub{font:400 40px Sarabun,"Noto Sans Thai",sans-serif;fill:#4F7465;text-anchor:middle}
    .icon{fill:none;stroke:#17966A;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
    .line{stroke:#B8DDCB;stroke-width:8}
  </style>
  <rect width="2500" height="1686" fill="#F7FCF9"/>
  <rect x="0" y="0" width="834" height="843" fill="#E6F7EE"/>
  <rect x="834" y="0" width="833" height="843" fill="#EEF8DF"/>
  <rect x="1667" y="0" width="833" height="843" fill="#FFF4D8"/>
  <rect x="0" y="843" width="834" height="843" fill="#EAF4FF"/>
  <rect x="834" y="843" width="833" height="843" fill="#F9ECF4"/>
  <rect x="1667" y="843" width="833" height="843" fill="#E3F7F5"/>
  <path class="line" d="M834 0v1686M1667 0v1686M0 843h2500"/>
  <!-- home -->
  <path class="icon" d="M205 340l212-177 212 177M266 307v238h302V307M370 545V405h94v140"/>
  <text class="title" x="417" y="660">หน้าหลัก</text><text class="sub" x="417" y="730">เปิดหน้าแรกของระบบ</text>
