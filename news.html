<!doctype html><html lang="th"><head><link rel="preconnect" href="https://sk-alumni-api.itpcmc2024.workers.dev" crossorigin><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข่าวสาร | SK Alumni</title>
<link rel="stylesheet" href="assets/site.css?v=2.6.79.1"><link rel="stylesheet" href="assets/public-footer.css?v=2.6.79.1"><link rel="stylesheet" href="assets/module-nav.css?v=2.6.79.1">
<style>
.news-shell{width:min(1260px,94vw);margin:34px auto}.news-frame{background:#fff;border:1px solid #d9ece2;border-radius:28px;padding:30px;box-shadow:0 12px 34px rgba(21,102,73,.06)}
.news-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px}.news-head h1{margin:8px 0 4px;font-family:Mitr,"Noto Sans Thai",sans-serif;color:#076846;font-size:clamp(30px,4vw,46px)}.muted{color:#718096}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px;margin:18px 0}.search{border:1px solid #d2e7dc;border-radius:15px;padding:12px 14px;font:inherit}.cats{display:flex;gap:8px;flex-wrap:wrap}.catbtn{border:1px solid #d0e4da;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;color:#52645d;cursor:pointer}.catbtn.active{background:#e5f8ee;color:#08744c;border-color:#9be2bd}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.news-card{border:1px solid #dcebe4;border-radius:22px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-height:310px;box-shadow:0 7px 22px rgba(13,97,67,.05);cursor:pointer;transition:.15s}.news-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(13,97,67,.09)}.thumb{height:170px;background:linear-gradient(135deg,#eefaf4,#edf6ff);display:grid;place-items:center;overflow:hidden;font-size:56px}.thumb img{width:100%;height:100%;object-fit:cover}.cardbody{padding:17px;display:flex;flex-direction:column;gap:8px;flex:1}.badge{display:inline-flex;width:max-content;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900}.badge.ข่าวสาร{background:#e6f8ee;color:#07804f}.badge.ประกาศ{background:#e7f2ff;color:#2767b2}.badge.กิจกรรม{background:#ffeaf2;color:#b64070}.news-card h2{font-family:Mitr,"Noto Sans Thai",sans-serif;color:#173f32;font-size:20px;line-height:1.35;margin:0}.date{font-size:12px;color:#819087}.excerpt{color:#60736b;line-height:1.7;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.empty{grid-column:1/-1;padding:34px;text-align:center;border:1px dashed #cfe2d8;border-radius:20px;color:#74857d}
.modalback{display:none;position:fixed;inset:0;background:rgba(20,42,34,.58);z-index:9999;padding:22px;align-items:center;justify-content:center}.modalback.show{display:flex}.modal{width:min(850px,96vw);max-height:90vh;background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}.modalhead{display:flex;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid #e5eee9}.close{border:0;background:#eef5f1;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer}.modalbody{padding:22px;overflow:auto}.detail-img{width:100%;max-height:420px;object-fit:contain;border-radius:18px;background:#f6faf8;margin-bottom:18px}.gallery-strip{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 12px}.gallery-strip img{width:110px;height:86px;object-fit:cover;border-radius:12px;border:2px solid transparent;cursor:pointer;flex:0 0 auto}.gallery-strip img.active{border-color:#13aa74}.gallery-main{width:100%;height:min(430px,55vh);object-fit:contain;border-radius:18px;background:#f6faf8;margin-bottom:8px}.gallery-nav{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.gallery-nav button{border:1px solid #cfe2d8;background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}.detail-title{font-family:Mitr,"Noto Sans Thai",sans-serif;color:#076846;font-size:30px;margin:8px 0}.detail-content{white-space:pre-wrap;line-height:1.9;color:#405166}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.news-shell{width:94vw;margin:20px auto}.news-frame{padding:20px 16px;border-radius:22px}.news-head{display:block}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.thumb{height:190px}.cats{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.catbtn{white-space:nowrap}}
</style><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script defer src="assets/ui-feedback.js?v=2.6.79.1"></script></head><body>
<main class="news-shell"><section class="news-frame"><div class="sk-module-badge">📣 ข่าวสาร</div><div class="news-head"><div><h1>ข่าวสารและกิจกรรม</h1><div class="muted">ติดตามข่าว กิจกรรม และประกาศล่าสุดของสมาคม</div></div></div><div class="toolbar"><input id="q" class="search" placeholder="ค้นหาหัวข้อหรือเนื้อหา"><div class="cats"><button class="catbtn active" data-cat="all">ทั้งหมด</button><button class="catbtn" data-cat="ข่าวสาร">ข่าวสาร</button><button class="catbtn" data-cat="ประกาศ">ประกาศ</button><button class="catbtn" data-cat="กิจกรรม">กิจกรรม</button></div></div><div id="grid" class="grid"><div class="empty">กำลังโหลด...</div></div></section></main>
<div id="modalBack" class="modalback"><article class="modal"><div class="modalhead"><div><span id="mCat" class="badge ข่าวสาร">ข่าวสาร</span><div id="mDate" class="date" style="margin-top:7px"></div></div><button id="mClose" class="close">×</button></div><div id="mBody" class="modalbody"></div></article></div><div id="foot"></div>
<script>
const API='https://sk-alumni-api.itpcmc2024.workers.dev',S={rows:[],cat:'all',galleryIndex:0};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));
function parseImages(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);const t=String(v);if(t.startsWith('[')){try{const a=JSON.parse(t);if(Array.isArray(a))return a.filter(Boolean)}catch{}}return[t]}
const fmt=v=>{try{return new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(v))+' น.'}catch{return String(v||'-')}};
function filtered(){const q=$('q').value.trim().toLowerCase();return S.rows.filter(n=>(S.cat==='all'||n.category===S.cat)&&(!q||[n.title,n.content,n.category].join(' ').toLowerCase().includes(q)))}
function render(){const rows=filtered();$('grid').innerHTML=rows.length?rows.map(n=>`<article class="news-card" data-id="${esc(n.news_id)}"><div class="thumb">${parseImages(n.image_data)[0]?`<img src="${parseImages(n.image_data)[0]}" alt="${esc(n.title)}">`:(n.category==='กิจกรรม'?'🎉':n.category==='ประกาศ'?'📢':'🌿')}</div><div class="cardbody"><span class="badge ${esc(n.category)}">${esc(n.category)}</span><h2>${esc(n.title)}</h2><div class="date">${fmt(n.publish_date)}</div><div class="excerpt">${esc(n.content)}</div></div></article>`).join(''):'<div class="empty">ยังไม่มีข่าวสารในหมวดนี้</div>';document.querySelectorAll('.news-card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id))}
function galleryHtml(imgs){if(!imgs.length)return'';S.galleryIndex=0;return `<img id="galleryMain" class="gallery-main" src="${imgs[0]}" alt=""><div class="gallery-nav"><button type="button" id="gPrev">‹ รูปก่อนหน้า</button><span id="gCount">1 / ${imgs.length}</span><button type="button" id="gNext">รูปถัดไป ›</button></div><div class="gallery-strip" id="galleryStrip">${imgs.map((x,i)=>`<img class="${i===0?'active':''}" src="${x}" data-i="${i}" alt="รูป ${i+1}">`).join('')}</div>`}
function bindGallery(imgs){if(!imgs.length)return;const go=i=>{S.galleryIndex=(i+imgs.length)%imgs.length;$('galleryMain').src=imgs[S.galleryIndex];$('gCount').textContent=`${S.galleryIndex+1} / ${imgs.length}`;document.querySelectorAll('#galleryStrip img').forEach(x=>x.classList.toggle('active',+x.dataset.i===S.galleryIndex));document.querySelector('#galleryStrip img.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})};$('gPrev').onclick=()=>go(S.galleryIndex-1);$('gNext').onclick=()=>go(S.galleryIndex+1);document.querySelectorAll('#galleryStrip img').forEach(x=>x.onclick=()=>go(+x.dataset.i))}
function openDetail(id){const n=S.rows.find(x=>x.news_id===id);if(!n)return;const imgs=parseImages(n.image_data);$('mCat').textContent=n.category;$('mCat').className='badge '+n.category;$('mDate').textContent=fmt(n.publish_date);$('mBody').innerHTML=`${galleryHtml(imgs)}<h2 class="detail-title">${esc(n.title)}</h2><div class="detail-content">${esc(n.content)}</div>`;$('modalBack').classList.add('show');bindGallery(imgs)}
$('mClose').onclick=()=>$('modalBack').classList.remove('show');$('modalBack').onclick=e=>{if(e.target===$('modalBack'))$('modalBack').classList.remove('show')};$('q').oninput=render;document.querySelectorAll('.catbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.catbtn').forEach(x=>x.classList.toggle('active',x===b));S.cat=b.dataset.cat;render()});
$('foot').innerHTML='<footer class="sk-public-admin-footer"><div class="sk-public-admin-footer__in"><div class="sk-public-admin-footer__brand"><img src="assets/association-logo.png" alt="โลโก้สมาคม"><div class="sk-public-admin-footer__text"><div class="sk-public-admin-footer__name">สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</div><div class="sk-public-admin-footer__values">🌙 ศรัทธา · 📚 ความรู้ · 💚 สายสัมพันธ์</div></div></div><div class="sk-public-admin-footer__copy">© 2026 SK Alumni Member System by KimhanIkals - ข่าวสาร · V2.6.79.1.1</div></div></footer>';
(async()=>{try{const r=await fetch(API+'/api/news',{cache:'no-store'}),j=await r.json();if(!r.ok||j.success===false)throw new Error(j.message||'โหลดข่าวไม่สำเร็จ');S.rows=j.data||[];render()}catch(e){$('grid').innerHTML='<div class="empty">โหลดข่าวไม่สำเร็จ: '+esc(e.message)+'</div>'}})();
</script><script defer src="assets/module-nav.js?v=2.6.79.1"></script></body></html>
