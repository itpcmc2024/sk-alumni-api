<link rel="stylesheet" href="assets/module-nav.css?v=2.6.18">
</head><body>
<header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">สิทธิประโยชน์สมาชิก</div><div class="brand-sub">SK Alumni Member System</div></div><nav class="nav"><a href="index.html">หน้าแรก</a><a class="active" href="benefits.html">สิทธิประโยชน์</a><a href="member.html">ข้อมูลสมาชิก</a></nav></div></header><main class="wrap">
  <h1 class="section-title">สิทธิประโยชน์สำหรับสมาชิก</h1>
  <div class="card" style="margin:0 0 18px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#effbf4,#fff9e8)">
    <div style="font-weight:900;color:#08744c;font-size:18px">เข้าสู่ระบบสมาชิก</div>
    <div class="sub" style="margin:4px 0 12px">กรอกรหัสสมาชิก และอีเมลหรือเบอร์โทรศัพท์ที่ใช้สมัคร</div>
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px" class="benefit-login-grid">
      <input id="bCode" placeholder="รหัสสมาชิก เช่น 69-SK0001" style="height:48px;border:1px solid #cfe1d8;border-radius:13px;padding:0 13px">
      <input id="bIdentity" placeholder="อีเมล หรือ เบอร์โทรศัพท์" style="height:48px;border:1px solid #cfe1d8;border-radius:13px;padding:0 13px">
      <button id="bLogin" style="border:0;border-radius:13px;padding:0 18px;background:#287b5d;color:white;font-weight:800">เข้าสู่ระบบ</button>
    </div>
    <div id="memberGreeting" style="display:none;margin-top:14px;padding:15px;border-radius:15px;background:#fff;border:1px solid #dcece3"></div>
  </div>
  <div id="list" class="grid"></div>
</main><div id="foot"></div>
<script>
foot.innerHTML=footer('Benefits');
const API_BASE='https://sk-alumni-api.itpcmc2024.workers.dev';
async function benefitLogin(){
 const code=bCode.value.trim().toUpperCase(),identity=bIdentity.value.trim(); if(!code||!identity)return Swal.fire({icon:'warning',title:'กรุณากรอกข้อมูลให้ครบ'});
 bLogin.disabled=true;
 try{const r=await fetch(API_BASE+'/api/member/benefits-info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({member_code:code,identity})});const j=await r.json();if(!r.ok||j.success===false)throw new Error(j.message||'เข้าสู่ระบบไม่สำเร็จ');const m=j.data||{};const name=(m.arabic_name||[m.prefix,m.first_name,m.last_name].filter(Boolean).join(' ')).trim();let actions=`<a href="payment.html?code=${encodeURIComponent(m.member_code||code)}" style="display:inline-flex;margin-top:12px;padding:10px 15px;border-radius:12px;background:#ec4899;color:#fff;font-weight:800;text-decoration:none">💳 ชำระค่าสมาชิก</a>`;if(m.status==='active')actions+=` <a href="member.html?code=${encodeURIComponent(m.member_code||code)}" style="display:inline-flex;margin-top:12px;padding:10px 15px;border-radius:12px;background:#287b5d;color:#fff;font-weight:800;text-decoration:none">🎁 เข้าสู่ข้อมูลและสิทธิประโยชน์ของฉัน</a>`;memberGreeting.style.display='block';memberGreeting.innerHTML=`<b style="color:#08744c">คุณ ${e(name||'-')} เป็นสมาชิกศิษย์เก่าของสมาคมฯ</b><div style="margin-top:5px">หากต้องการดูรายละเอียด สามารถสนับสนุนค่าบำรุงสมาชิกรายปีได้ที่ปุ่ม “ชำระค่าสมาชิก” ขอบคุณค่ะ</div>${m.status==='renewal'?'<div style="margin-top:7px;color:#a36a00;font-weight:800">สถานะ: รอต่ออายุสมาชิก</div>':''}${actions}`;}catch(err){Swal.fire({icon:'error',title:'เข้าสู่ระบบไม่สำเร็จ',text:err.message})}finally{bLogin.disabled=false}}
bLogin.onclick=benefitLogin;[bCode,bIdentity].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')benefitLogin()}));
(async()=>{try{const j=await api('/api/benefits');const rows=j.data||[];list.innerHTML=rows.length?rows.map(x=>`<div class="card module"><div class="icon">🎁</div><h3>${e(x.title)}</h3><p>${e(x.description||'')}</p><div class="sub">${x.end_date?'ถึง '+e(x.end_date):'ไม่มีวันสิ้นสุด'}</div></div>`).join(''):'<div class="card">ยังไม่มีสิทธิประโยชน์ที่เปิดใช้งาน</div>'}catch(err){list.innerHTML=`<div class="card">โหลดข้อมูลไม่สำเร็จ: ${e(err.message)}</div>`}})();
</script>
<style>@media(max-width:700px){.benefit-login-grid{grid-template-columns:1fr!important}}</style>
<script src="assets/module-nav.js?v=2.6.18"></script>
</body></html>
