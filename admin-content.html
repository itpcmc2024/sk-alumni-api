<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการข่าวสาร | Admin</title><link rel="stylesheet" href="assets/site.css?v=2.6.53"><link rel="stylesheet" href="assets/module-nav.css?v=2.6.53"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>
body{font-family:"Noto Sans Thai",Arial,sans-serif}.wrap2{width:min(1240px,94vw);margin:28px auto}.titlebar{display:flex;align-items:center;gap:14px;margin-bottom:18px}.titlebar h1{font-family:Mitr,"Noto Sans Thai",sans-serif;color:#076846;margin:0;font-size:32px}.back{margin-left:auto;border:1px solid #cde6d9;border-radius:999px;padding:9px 14px;color:#08744c;text-decoration:none;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{border:1px solid #d8ebe1;border-radius:19px;padding:15px;background:#fff}.stat b{display:block;font-size:28px;color:#08744c;margin-top:4px}.panel{background:#fff;border:1px solid #dcebe4;border-radius:24px;padding:20px;box-shadow:0 8px 24px rgba(13,97,67,.05)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #cfe4d9;background:#fff;border-radius:999px;padding:10px 15px;font-weight:800;color:#52645d;cursor:pointer}.tab.active{background:#e4f8ed;color:#08744c;border-color:#91dcaf}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{font-weight:800;color:#385b4d;font-size:13px}.control{width:100%;box-sizing:border-box;border:1px solid #cfe2d8;border-radius:14px;padding:11px 13px;font:inherit;background:#fff}.control:focus{outline:3px solid #dff6ea;border-color:#6ac99a}.textarea{min-height:150px;resize:vertical}.preview{max-width:280px;max-height:170px;border-radius:14px;object-fit:cover;background:#f3f8f5}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:900;cursor:pointer;background:#10a66f;color:#fff}.btn.secondary{background:#eef5f1;color:#476056}.btn:active,.mini:active,.tab:active{transform:translateY(1px) scale(.98)}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) 180px 160px auto;gap:10px;align-items:center}.tablewrap{overflow:auto;margin-top:14px;border:1px solid #e0ece6;border-radius:18px}.tbl{width:100%;border-collapse:collapse;min-width:900px}.tbl th,.tbl td{padding:12px 10px;border-bottom:1px solid #e7efeb;text-align:left;vertical-align:middle}.tbl th{background:#f4f9f6;font-size:12px;color:#62756d}.thumb{width:72px;height:54px;border-radius:10px;object-fit:cover;background:#eff7f3}.mini{border:0;border-radius:9px;padding:7px 9px;font-weight:800;cursor:pointer}.view{background:#e5f3ff;color:#2563a6}.edit{background:#fff3cd;color:#946200}.del{background:#ffe5eb;color:#b73557}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.ข่าวสาร{background:#e4f8ed;color:#08744c}.ประกาศ{background:#e7f2ff;color:#2767b2}.กิจกรรม{background:#ffeaf2;color:#b64070}.off{background:#f0f1f2;color:#6c7378}.pager{display:flex;gap:7px;align-items:center;justify-content:flex-end;margin-top:12px}.pagebtn{border:1px solid #d5e5dc;background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.loginback{position:fixed;inset:0;background:rgba(18,41,32,.65);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}.loginback.hidden{display:none}.loginbox{width:min(420px,94vw);background:#fff;border-radius:22px;padding:24px}.loginbox h2{font-family:Mitr,"Noto Sans Thai",sans-serif;color:#076846}.muted{color:#718096;font-size:13px}.hidden{display:none!important}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.wrap2{margin:18px auto}.panel{padding:15px}.titlebar{align-items:flex-start}.titlebar h1{font-size:27px}}
</style></head><body>
<main class="wrap2"><div class="titlebar"><div><div class="sk-module-badge">📣 ข่าวสาร</div><h1>จัดการข่าวสารและกิจกรรม</h1></div><a class="back" href="admin-home.html?v=2.6.53">🧩 ศูนย์จัดการระบบ</a></div><div class="stats"><div class="stat">ทั้งหมด<b id="sAll">0</b></div><div class="stat">ข่าวสาร<b id="sNews">0</b></div><div class="stat">ประกาศ<b id="sAnn">0</b></div><div class="stat">กิจกรรม<b id="sAct">0</b></div></div><section class="panel"><div class="tabs"><button class="tab active" data-tab="list">📋 รายการข่าว</button><button class="tab" data-tab="form">✍️ เพิ่มข่าว/กิจกรรม</button></div>
<div id="formPanel" class="hidden"><form id="newsForm"><input id="editId" type="hidden"><div class="formgrid"><div class="field"><label>หมวด *</label><select id="category" class="control"><option>ข่าวสาร</option><option>ประกาศ</option><option>กิจกรรม</option></select></div><div class="field"><label>วันเวลาเผยแพร่ *</label><input id="publishDate" class="control" type="datetime-local" step="1"></div><div class="field wide"><label>หัวข้อ *</label><input id="title" class="control" required></div><div class="field wide"><label>เนื้อหา *</label><textarea id="content" class="control textarea" required></textarea></div><div class="field"><label>รูปประกอบ (ไม่บังคับ)</label><input id="imageFile" class="control" type="file" accept="image/jpeg,image/png,image/webp"><label style="font-weight:500"><input id="removeImage" type="checkbox"> ลบรูปเดิม</label></div><div class="field"><label>การแสดงผล</label><label><input id="active" type="checkbox" checked> เปิดเผยต่อหน้าเว็บ</label><label><input id="featured" type="checkbox"> ปักเป็นข่าวเด่น</label></div><div class="field wide"><img id="preview" class="preview hidden" alt="ตัวอย่างรูป"></div></div><div class="actions"><button id="cancelEdit" type="button" class="btn secondary">ยกเลิก</button><button id="saveBtn" class="btn" type="submit">บันทึก</button></div></form></div>
<div id="listPanel"><div class="toolbar"><input id="q" class="control search" placeholder="ค้นหาหัวข้อ / เนื้อหา"><select id="catFilter" class="control"><option value="all">ทุกหมวด</option><option>ข่าวสาร</option><option>ประกาศ</option><option>กิจกรรม</option></select><select id="size" class="control"><option>10</option><option>20</option><option>50</option><option>100</option></select><button id="refresh" class="btn secondary">↻ รีเฟรช</button></div><div class="tablewrap"><table class="tbl"><thead><tr><th>รูป</th><th>หัวข้อ</th><th>หมวด</th><th>เผยแพร่</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button id="prev" class="pagebtn">‹ ก่อนหน้า</button><span id="page">หน้า 1 / 1</span><button id="next" class="pagebtn">ถัดไป ›</button></div></div></section></main><div id="foot"></div>
<div id="loginBack" class="loginback"><div class="loginbox"><h2>เข้าสู่ระบบ Admin</h2><p class="muted">ใช้ Admin API Key เดียวกับโมดูลสมาชิก</p><input id="adminKey" class="control" type="password" placeholder="Admin API Key"><label style="display:flex;gap:7px;margin:12px 0"><input id="remember" type="checkbox" checked> จำการเข้าสู่ระบบในเครื่องนี้</label><button id="loginBtn" class="btn" style="width:100%">เข้าสู่ระบบ</button><div id="loginError" class="muted" style="color:#b33;margin-top:8px"></div></div></div>
<script>
const API='https://sk-alumni-api.itpcmc2024.workers.dev',KEYS=['sk_alumni_admin_key','SK_ALUMNI_ADMIN_KEY'],$=id=>document.getElementById(id),S={key:'',rows:[],page:1,imageData:'',imageName:''};const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));const fmt=v=>{try{return new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(v))+' น.'}catch{return String(v||'-')}};
function stored(){for(const k of KEYS){const v=localStorage.getItem(k)||sessionStorage.getItem(k);if(v)return v}return''}function saveKey(){const st=$('remember').checked?localStorage:sessionStorage;KEYS.forEach(k=>st.setItem(k,S.key))}function clearKey(){KEYS.forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)})}
async function api(path,opts={}){const r=await fetch(API+path,{cache:'no-store',...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.key,...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok||j.success===false){const e=new Error(j.message||'HTTP '+r.status);e.status=r.status;throw e}return j}
function toLocal(v=new Date()){const d=new Date(v),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function stats(){const r=S.rows;$('sAll').textContent=r.length;$('sNews').textContent=r.filter(x=>x.category==='ข่าวสาร').length;$('sAnn').textContent=r.filter(x=>x.category==='ประกาศ').length;$('sAct').textContent=r.filter(x=>x.category==='กิจกรรม').length}
function filtered(){const q=$('q').value.trim().toLowerCase(),c=$('catFilter').value;return S.rows.filter(n=>(c==='all'||n.category===c)&&(!q||[n.title,n.content].join(' ').toLowerCase().includes(q)))}
function render(){stats();const rows=filtered(),size=+$('size').value||10,pages=Math.max(1,Math.ceil(rows.length/size));S.page=Math.min(S.page,pages);const start=(S.page-1)*size,view=rows.slice(start,start+size);$('page').textContent=`หน้า ${S.page} / ${pages}`;$('prev').disabled=S.page<=1;$('next').disabled=S.page>=pages;$('tbody').innerHTML=view.length?view.map(n=>`<tr><td>${n.image_data?`<img class="thumb" src="${n.image_data}" alt="">`:'—'}</td><td><b>${esc(n.title)}</b>${n.featured?'<div class="muted">⭐ ข่าวเด่น</div>':''}</td><td><span class="badge ${esc(n.category)}">${esc(n.category)}</span></td><td>${fmt(n.publish_date)}</td><td><span class="badge ${n.active?'ข่าวสาร':'off'}">${n.active?'เผยแพร่':'ซ่อน'}</span></td><td><button class="mini view" data-act="view" data-id="${n.news_id}">ดู</button> <button class="mini edit" data-act="edit" data-id="${n.news_id}">แก้ไข</button> <button class="mini del" data-act="del" data-id="${n.news_id}">ลบ</button></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:28px">ยังไม่มีข้อมูล</td></tr>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id))}
async function load(){const j=await api('/api/admin/news');S.rows=j.data||[];render()}
function showTab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$('formPanel').classList.toggle('hidden',name!=='form');$('listPanel').classList.toggle('hidden',name!=='list')}
function resetForm(){S.imageData='';S.imageName='';$('editId').value='';$('category').value='ข่าวสาร';$('publishDate').value=toLocal();$('title').value='';$('content').value='';$('imageFile').value='';$('removeImage').checked=false;$('active').checked=true;$('featured').checked=false;$('preview').src='';$('preview').classList.add('hidden');$('saveBtn').textContent='บันทึก'}
async function fileData(file){if(!file)return'';if(file.size>1600000)throw new Error('รูปใหญ่เกินไป กรุณาใช้รูปไม่เกินประมาณ 1.5 MB');return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function act(a,id){const n=S.rows.find(x=>x.news_id===id);if(!n)return;if(a==='view'){Swal.fire({title:n.title,html:`<div style="text-align:left">${n.image_data?`<img src="${n.image_data}" style="max-width:100%;max-height:300px;object-fit:contain;border-radius:12px">`:''}<p><b>${n.category}</b> · ${fmt(n.publish_date)}</p><div style="white-space:pre-wrap;line-height:1.8">${esc(n.content)}</div></div>`,width:720});return}if(a==='edit'){resetForm();$('editId').value=n.news_id;$('category').value=n.category;$('publishDate').value=toLocal(n.publish_date);$('title').value=n.title;$('content').value=n.content;$('active').checked=!!n.active;$('featured').checked=!!n.featured;if(n.image_data){$('preview').src=n.image_data;$('preview').classList.remove('hidden')}$('saveBtn').textContent='บันทึกแก้ไข';showTab('form');return}if(a==='del'){const c=await Swal.fire({icon:'warning',title:'ลบข่าวสารนี้?',text:n.title,showCancelButton:true,confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#d94b67'});if(!c.isConfirmed)return;await api('/api/admin/news/'+encodeURIComponent(id),{method:'DELETE'});await load();Swal.fire({icon:'success',title:'ลบแล้ว',timer:800,showConfirmButton:false})}}
$('newsForm').onsubmit=async e=>{e.preventDefault();const file=$('imageFile').files[0];try{if(file){S.imageData=await fileData(file);S.imageName=file.name}const body={category:$('category').value,title:$('title').value.trim(),content:$('content').value.trim(),publish_date:new Date($('publishDate').value).toISOString(),active:$('active').checked,featured:$('featured').checked,image_data:S.imageData,image_name:S.imageName,remove_image:$('removeImage').checked};const id=$('editId').value;$('saveBtn').disabled=true;$('saveBtn').textContent='กำลังบันทึก...';await api(id?'/api/admin/news/'+encodeURIComponent(id):'/api/admin/news',{method:id?'PUT':'POST',body:JSON.stringify(body)});await load();resetForm();showTab('list');Swal.fire({icon:'success',title:'บันทึกแล้ว',timer:900,showConfirmButton:false})}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}finally{$('saveBtn').disabled=false;if(!$('editId').value)$('saveBtn').textContent='บันทึก'}};
$('imageFile').onchange=async()=>{const f=$('imageFile').files[0];if(!f)return;try{const d=await fileData(f);$('preview').src=d;$('preview').classList.remove('hidden')}catch(e){Swal.fire({icon:'error',title:e.message});$('imageFile').value=''}};$('cancelEdit').onclick=()=>{resetForm();showTab('list')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='form'&&!$('editId').value)resetForm();showTab(b.dataset.tab)});$('q').oninput=()=>{S.page=1;render()};$('catFilter').onchange=()=>{S.page=1;render()};$('size').onchange=()=>{S.page=1;render()};$('prev').onclick=()=>{S.page--;render()};$('next').onclick=()=>{S.page++;render()};$('refresh').onclick=load;
$('foot').innerHTML='<footer class="admin-public-footer"><div class="apf-inner"><div class="apf-brand"><img class="apf-logo" src="assets/association-logo.png" alt="โลโก้สมาคม"><div><div class="apf-title">สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</div><div class="apf-sub">🌙 ศรัทธา · 📚 ความรู้ · 💚 สายสัมพันธ์</div></div></div><div class="apf-copy">© 2026 SK Alumni Member System by KimhanIkals - Admin Center · V2.6.53</div></div></footer>';
$('loginBtn').onclick=async()=>{S.key=$('adminKey').value.trim();if(!S.key)return;try{saveKey();await load();$('loginBack').classList.add('hidden')}catch(e){clearKey();$('loginError').textContent='Admin API Key ไม่ถูกต้อง'}};(async()=>{resetForm();const k=stored();if(k){S.key=k;$('adminKey').value=k;try{await load();$('loginBack').classList.add('hidden')}catch{clearKey()}}})();
</script><script defer src="assets/module-nav.js?v=2.6.53"></script></body></html>
