<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Finance</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script>

<style id="v26-global-nav">
.v26-homebar{max-width:1220px;margin:14px auto 0;padding:0 18px;display:flex;justify-content:flex-end}
.v26-homebtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
border:1px solid #bfe4cf;background:#f7fff9;color:#08744c;font-weight:800;text-decoration:none;
box-shadow:0 5px 14px rgba(28,111,74,.07)}
.v26-homebtn:hover{background:#eaf9f1}
@media(max-width:760px){.v26-homebar{justify-content:flex-end;margin-top:10px;padding-right:14px}.v26-homebtn{font-size:13px}}
</style>

<style id="v26-footer-mobile">

  footer .wrap, .site-footer-in, .footin{
    text-align:center!important;
  }
  .site-footer-in, .footin{
    display:flex!important;
    flex-direction:column!important;
    align-items:center!important;
    justify-content:center!important;
    gap:18px!important;
  }
  .site-footer-brand, .footbrand{
    display:flex!important;
    flex-direction:row!important;
    align-items:center!important;

    gap:14px!important;

  .site-footer-brand img, .footbrand img, footer .footer-logo{
    width:72px!important;

    object-fit:contain!important;
    background:transparent!important;
    border:3px solid rgba(50,169,105,.22)!important;
    box-shadow:0 0 0 7px rgba(224,249,234,.65),0 8px 18px rgba(27,118,76,.14)!important;

<link rel="stylesheet" href="assets/module-nav.css">
</head><body>
<div class="v26-homebar"><a class="v26-homebtn" href="index.html">← กลับหน้าหลัก</a></div>

<header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">การเงิน</div><div class="brand-sub">Admin · Pastel Light</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a><a class="active" href="admin-finance.html">การเงิน</a></nav></div></header><main class="wrap"><div class="card" style="margin-top:28px"><div class="row2"><div class="field"><label>Admin API Key</label><input id="key" class="control" type="password"></div><div style="display:flex;align-items:end"><button id="load" class="btn">โหลดรายการ</button></div></div></div><h2 class="section-title">💳 การชำระ</h2><div id="payments" class="list"></div><h2 class="section-title">💝 การบริจาค</h2><div id="donations" class="list"></div></main><div id="foot"></div><script>
foot.innerHTML=footer('Admin Finance');const auth=()=>({Authorization:'Bearer '+key.value.trim()});
function pCard(x){const done=x.status==='ชำระแล้ว',pending=x.status==='รอตรวจสอบการชำระ';return `<div class="item"><b>${e(x.payment_id)}</b> · ${e(x.member_code)} · ฿${e(x.amount)} <span class="badge ${done?'active':'pending'}">${e(x.status)}</span><div class="sub">${fmtDate(x.paid_at)} · ${e(x.payment_type||'ชำระค่าสมาชิก')}</div>${x.slip_data?`<div style="margin-top:8px"><img src="${x.slip_data}" style="width:120px;height:150px;object-fit:cover;border-radius:10px;border:1px solid #ddd"></div>`:''}${pending?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="verifyPay('${e(x.payment_id)}','approve')">✓ ยืนยันการชำระ</button><button class="btn" style="background:#fff1f2;color:#be123c" onclick="verifyPay('${e(x.payment_id)}','reject')">✕ ไม่อนุมัติ</button></div>`:''}</div>`}
async function refresh(){const [p,d]=await Promise.all([api('/api/admin/payments',{headers:auth()}),api('/api/admin/donations',{headers:auth()})]);payments.innerHTML=(p.data||[]).map(pCard).join('')||'<div class="item">ไม่มีรายการ</div>';donations.innerHTML=(d.data||[]).map(x=>`<div class="item"><b>${e(x.donation_id)}</b> · ${e(x.donor_name||'-')} · ฿${e(x.amount)} <span class="badge pending">${e(x.status)}</span></div>`).join('')||'<div class="item">ไม่มีรายการ</div>'}
load.onclick=async()=>{try{await refresh()}catch(err){Swal.fire({icon:'error',title:'โหลดไม่สำเร็จ',text:err.message})}};
async function verifyPay(id,action){const ans=await Swal.fire({icon:'question',title:action==='approve'?'ยืนยันการชำระ?':'ไม่อนุมัติรายการ?',text:action==='approve'?'ระบบจะต่ออายุสมาชิก 1 ปี และลงบัญชีรายรับอัตโนมัติ':'รายการจะถูกบันทึกเป็นไม่อนุมัติ',showCancelButton:true,confirmButtonText:'ยืนยัน',cancelButtonText:'ยกเลิก'});if(!ans.isConfirmed)return;try{const j=await api('/api/admin/payments/'+encodeURIComponent(id)+'/verify',{method:'PATCH',headers:auth(),body:JSON.stringify({action,verified_by:'admin'})});await Swal.fire({icon:'success',title:'เรียบร้อย',text:j.message});refresh()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}}
</script><script src="assets/module-nav.js"></script>
</body></html>
