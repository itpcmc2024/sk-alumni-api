<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Receipt Center</title><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/module-nav.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 12px}.tab{border:1px solid #cfe4d9;background:#fff;color:#446259;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer}.tab.active{background:#08744c;color:#fff}.panel[hidden]{display:none!important}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:900px}.tbl th,.tbl td{padding:11px;border-bottom:1px solid #e5eee9;text-align:left}.tbl th{background:#f1f8f4;color:#61776d}.mini{border:0;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer}.view{background:#e6f2ff;color:#1766a3}.print{background:#e1f8ec;color:#08744c}.batch{background:#08744c;color:#fff}.muted{font-size:12px;color:#7d8d86}.count{font-weight:800;color:#08744c}@media(max-width:800px){.toolbar{grid-template-columns:1fr}.tbl{min-width:760px}}</style></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">ศูนย์จัดการใบเสร็จ</div><div class="brand-sub">Admin · V2.6.17</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a><a href="admin-finance.html">ธุรกรรม</a><a class="active">ใบเสร็จ</a></nav></div></header><main class="wrap"><div class="tabs"><button class="tab active" data-p="receipts">🧾 ใบเสร็จทั้งหมด</button><button class="tab" data-p="logs">🕘 Log การพิมพ์</button></div><section id="rp-receipts" class="panel card"><div class="toolbar"><input id="q" class="control" placeholder="ค้นหาเลขใบเสร็จ / รหัสสมาชิก / ชื่อ"><button id="reload" class="btn alt">รีเฟรช</button><button id="printSelected" class="mini batch">🖨 พิมพ์ที่เลือก</button></div><p class="muted">เลือกได้หลายใบเพื่อพิมพ์ต่อเนื่องครั้งเดียว แต่ละใบจะเป็น A4 ที่มี ต้นฉบับ + สำเนา</p><div class="tablewrap"><table class="tbl"><thead><tr><th><input id="all" type="checkbox"></th><th>เลขใบเสร็จ</th><th>สมาชิก</th><th>รายการ</th><th>จำนวน</th><th>ออกใบเสร็จ</th><th>พิมพ์แล้ว</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="rp-logs" class="panel card" hidden><div class="toolbar"><input id="lq" class="control" placeholder="ค้นหา Log / ใบเสร็จ / ผู้พิมพ์"><button id="reloadLog" class="btn alt">รีเฟรช</button><span></span></div><div class="tablewrap"><table class="tbl"><thead><tr><th>วันเวลาพิมพ์</th><th>ใบเสร็จ</th><th>Payment</th><th>ประเภท</th><th>Batch</th><th>ผู้พิมพ์</th></tr></thead><tbody id="logRows"></tbody></table></div></section></main><div id="foot"></div><script>foot.innerHTML=footer('Receipt Center');const key=localStorage.getItem('sk_alumni_admin_key')||sessionStorage.getItem('sk_alumni_admin_key')||'';let R=[],L=[];const auth=()=>({Authorization:'Bearer '+key}),money=v=>Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){if(!key)return Swal.fire({icon:'warning',title:'กรุณาเข้าสู่ Admin ก่อน'});const [r,l]=await Promise.all([api('/api/admin/receipts',{headers:auth()}),api('/api/admin/receipt-print-logs',{headers:auth()})]);R=r.data||[];L=l.data||[];render();renderLogs()}function fullname(x){return [x.prefix,x.first_name,x.last_name].filter(Boolean).join(' ')||x.full_name||'-'}function render(){const t=q.value.trim().toLowerCase();const arr=R.filter(x=>!t||[x.receipt_no,x.payment_id,x.member_code,fullname(x)].join(' ').toLowerCase().includes(t));rows.innerHTML=arr.map(x=>{const c=L.filter(l=>l.payment_id===x.payment_id).length;return `<tr><td><input class="pick" type="checkbox" value="${e(x.payment_id)}"></td><td><b>${e(x.receipt_no||'-')}</b><div class="muted">${e(x.payment_id)}</div></td><td>${e(fullname(x))}<div class="muted">${e(x.member_code)}</div></td><td>${e(x.payment_type||'-')}</td><td>${money(x.amount)}</td><td>${fmtDate(x.receipt_issued_at)}</td><td class="count">${c} ครั้ง</td><td><button class="mini view" onclick="window.open('receipt.html?id=${encodeURIComponent(x.payment_id)}','_blank')">ดู</button> <button class="mini print" onclick="one('${e(x.payment_id)}')">พิมพ์</button></td></tr>`}).join('')||'<tr><td colspan="8">ไม่พบใบเสร็จ</td></tr>'}function renderLogs(){const t=lq.value.trim().toLowerCase();const arr=L.filter(x=>!t||[x.log_id,x.receipt_no,x.payment_id,x.printed_by,x.batch_id].join(' ').toLowerCase().includes(t));logRows.innerHTML=arr.map(x=>`<tr><td>${fmtDate(x.printed_at)}</td><td>${e(x.receipt_no||'-')}</td><td>${e(x.payment_id||'-')}</td><td>${e(x.print_type||'-')}</td><td>${e(x.batch_id||'-')}</td><td>${e(x.printed_by||'-')}</td></tr>`).join('')||'<tr><td colspan="6">ยังไม่มีประวัติการพิมพ์</td></tr>'}window.one=id=>window.open('receipt.html?id='+encodeURIComponent(id),'_blank');q.oninput=render;lq.oninput=renderLogs;reload.onclick=reloadLog.onclick=load;all.onchange=()=>document.querySelectorAll('.pick').forEach(x=>x.checked=all.checked);printSelected.onclick=()=>{const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)return Swal.fire({icon:'warning',title:'กรุณาเลือกใบเสร็จ'});window.open('receipt-batch.html?ids='+encodeURIComponent(ids.join(',')),'_blank')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!=='rp-'+b.dataset.p)});load().catch(err=>Swal.fire({icon:'error',title:'โหลดข้อมูลไม่สำเร็จ',text:err.message}));</script><script src="assets/module-nav.js"></script></body></html>
