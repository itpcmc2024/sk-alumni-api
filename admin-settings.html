<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Settings</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script>

<style id="v26-global-nav">
.v26-homebar{max-width:1220px;margin:14px auto 0;padding:0 18px;display:flex;justify-content:flex-end}
.v26-homebtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
border:1px solid #bfe4cf;background:#f7fff9;color:#08744c;font-weight:800;text-decoration:none;
box-shadow:0 5px 14px rgba(28,111,74,.07)}
.v26-homebtn:hover{background:#eaf9f1}
@media(max-width:760px){.v26-homebar{justify-content:flex-end;margin-top:10px;padding-right:14px}.v26-homebtn{font-size:13px}}
</style>

  footer .wrap, .site-footer-in, .footin{
    text-align:center!important;
  }
  .site-footer-in, .footin{
    display:flex!important;
    flex-direction:column!important;
    align-items:center!important;
    justify-content:center!important;
    gap:18px!important;
  }
  .site-footer-brand, .footbrand{
    display:flex!important;

  .site-footer-brand img, .footbrand img, footer .footer-logo{
    width:72px!important;

    object-fit:contain!important;
    background:transparent!important;
    border:3px solid rgba(50,169,105,.22)!important;
    box-shadow:0 0 0 7px rgba(224,249,234,.65),0 8px 18px rgba(27,118,76,.14)!important;

<link rel="stylesheet" href="assets/module-nav.css">
</head><body>
<div class="v26-homebar"><a class="v26-homebtn" href="index.html">← กลับหน้าหลัก</a></div>

<header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">ตั้งค่าระบบ</div><div class="brand-sub">Admin · V2.6.11</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a></nav></div></header><main class="wrap"><div class="card" style="margin-top:28px"><form id="f" class="form"><div class="field"><label>Admin API Key *</label><input id="key" class="control" type="password" required></div><div class="field"><label>ชื่อระบบ</label><input id="app" class="control"></div><div class="row2"><div class="field"><label>ค่าสมาชิกรายปี</label><input id="fee" class="control" type="number"></div><div class="field"><label>PromptPay</label><input id="promptpay" class="control"></div></div><div class="field"><label>อีเมลติดต่อ</label><input id="email" class="control" type="email"></div><button class="btn">บันทึกการตั้งค่า</button></form></div><div class="card" style="margin-top:20px"><h2 class="section-title">💳 หัวข้อรายการชำระสมาชิก</h2><p class="sub">เพิ่มหัวข้อที่สมาชิกสามารถเลือกในหน้าแจ้งชำระ และกำหนดยอดของแต่ละหัวข้อได้</p><div class="row2"><div class="field"><label>ชื่อหัวข้อ</label><input id="topicTitle" class="control" placeholder="เช่น ค่าบำรุงสมาชิกรายปี"></div><div class="field"><label>ยอดเงิน (บาท)</label><input id="topicAmount" class="control" type="number" min="0" step="0.01"></div></div><div class="field"><label>รายละเอียด</label><input id="topicDesc" class="control"></div><button type="button" id="addTopic" class="btn">เพิ่มหัวข้อ</button><div id="topicList" class="list" style="margin-top:15px"></div></div></main><div id="foot"></div><script>
foot.innerHTML=footer('Admin Settings');
const auth=()=>({Authorization:'Bearer '+key.value.trim()});
async function loadSettings(){try{const j=await api('/api/settings/public');const d=j.data||{};app.value=d.APP_NAME||'';fee.value=d.MEMBERSHIP_FEE_YEARLY||'';promptpay.value=d.PROMPTPAY||'';email.value=d.CONTACT_EMAIL||''}catch{}}
async function loadTopics(){if(!key.value.trim()){topicList.innerHTML='<div class="item">กรอก Admin API Key แล้วกด “โหลดหัวข้อ” หรือเพิ่มหัวข้อ</div>';return}try{const j=await api('/api/admin/payment-topics',{headers:auth()});const rows=j.data||[];topicList.innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${e(x.title)}</b> · ${x.amount==null?'ไม่กำหนดยอด':'฿'+e(x.amount)} <span class="badge ${x.active?'active':'pending'}">${x.active?'ใช้งาน':'ปิด'}</span>${x.active?` <button type="button" onclick="disableTopic('${e(x.topic_id)}')" style="margin-left:8px">ปิดใช้งาน</button>`:''}<div class="sub">${e(x.description||'')}</div></div>`).join(''):'<div class="item">ยังไม่มีหัวข้อ</div>'}catch(err){Swal.fire({icon:'error',title:'โหลดหัวข้อไม่สำเร็จ',text:err.message})}}
async function disableTopic(id){try{await api('/api/admin/payment-topics/'+encodeURIComponent(id),{method:'DELETE',headers:auth()});loadTopics()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}}
f.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/settings',{method:'PUT',headers:auth(),body:JSON.stringify({APP_NAME:app.value.trim(),MEMBERSHIP_FEE_YEARLY:fee.value,PROMPTPAY:promptpay.value.trim(),CONTACT_EMAIL:email.value.trim()})});Swal.fire({icon:'success',title:'บันทึกแล้ว'})}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};
addTopic.onclick=async()=>{if(!key.value.trim()||!topicTitle.value.trim())return Swal.fire({icon:'warning',title:'กรุณากรอก Admin API Key และชื่อหัวข้อ'});try{await api('/api/admin/payment-topics',{method:'POST',headers:auth(),body:JSON.stringify({title:topicTitle.value.trim(),amount:topicAmount.value,description:topicDesc.value.trim(),active:true})});topicTitle.value=topicAmount.value=topicDesc.value='';await loadTopics();Swal.fire({icon:'success',title:'เพิ่มหัวข้อแล้ว'})}catch(err){Swal.fire({icon:'error',title:'เพิ่มหัวข้อไม่สำเร็จ',text:err.message})}};
key.addEventListener('change',loadTopics);loadSettings();
</script><script src="assets/module-nav.js"></script>
</body></html>
