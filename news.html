<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข่าวสาร | SK Alumni</title><link rel="stylesheet" href="assets/site.css?v=2.6.26"></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">ข่าวสารและกิจกรรม</div><div class="brand-sub">SK Alumni Member System</div></div><nav class="nav"><a href="index.html">หน้าแรก</a></nav></div></header><main class="wrap"><h1 class="section-title">📣 ข่าวสารล่าสุด</h1><div id="list" class="list"><div class="card">กำลังโหลด...</div></div></main><div id="foot"></div><script>
const API='https://sk-alumni-api.itpcmc2024.workers.dev';const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));const fmt=v=>{try{return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return String(v||'-')}};document.getElementById('foot').innerHTML='<footer class="footer"><div class="wrap">© 2026 SK Alumni Member System by Kimhan · News V2.6.26</div></footer>';
(async()=>{try{const r=await fetch(API+'/api/news',{cache:'no-store'}),j=await r.json();if(!r.ok||j.success===false)throw new Error(j.message||'โหลดข่าวไม่สำเร็จ');const rows=j.data||[];document.getElementById('list').innerHTML=rows.length?rows.map(n=>`<article class="card"><span class="badge active">${esc(n.category||'ข่าวสาร')}</span><h2>${esc(n.title)}</h2><div style="color:#7a8797;font-size:13px">${fmt(n.publish_date)}</div><p style="line-height:1.8">${esc(n.content||'')}</p></article>`).join(''):'<div class="card">ยังไม่มีข่าวสาร</div>'}catch(e){document.getElementById('list').innerHTML='<div class="card">โหลดข่าวไม่สำเร็จ: '+esc(e.message)+'</div>'}})();</script></body></html>
