<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบสรุปการนำส่งเงิน | SK Alumni</title><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#eef8f3;color:#263d35;font-family:"Noto Sans Thai",sans-serif}.actions{width:190mm;margin:18px auto 8px;display:flex;justify-content:flex-end;gap:8px}.btn{border:1px solid #cfe3d9;background:#fff;color:#176348;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}.primary{background:#08744c;color:#fff}.paper{width:190mm;min-height:277mm;margin:0 auto 28px;background:#fff;padding:12mm 13mm;box-shadow:0 12px 38px rgba(32,80,60,.12)}.logo{display:block;width:25mm;height:25mm;object-fit:contain;margin:0 auto 3mm}.title{text-align:center}.title h1{font:600 20px Mitr;margin:0;color:#075f43}.title p{margin:3px 0 0;color:#657c72}.meta{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin:8mm 0 5mm}.box{border:1px solid #d9e7e0;border-radius:8px;padding:3mm}.box small{display:block;color:#74877f}.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl th,.tbl td{border:1px solid #cfded6;padding:2.5mm}.tbl th{background:#edf7f2}.num{text-align:right;white-space:nowrap}.summary{margin-top:5mm;margin-left:auto;width:95mm}.summary .row{display:flex;justify-content:space-between;border-bottom:1px dotted #b8c9c0;padding:2mm 0}.summary .total{font-weight:900;font-size:15px;color:#08744c}.sign{margin-top:22mm;display:flex;justify-content:flex-end}.signbox{text-align:center;width:70mm}.line{border-top:1px solid #425d52;margin-top:15mm;padding-top:2mm}.foot{margin-top:18mm;padding-top:3mm;border-top:1px dashed #c9d8d1;display:flex;justify-content:space-between;color:#7a8c84;font-size:9px}@media print{body{background:#fff}.actions{display:none}.paper{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}@page{size:A4;margin:10mm}}</style></head><body>
<div class="actions"><button class="btn" onclick="window.close()">ปิด</button><button id="printBtn" class="btn primary">🖨 พิมพ์ / PDF</button></div><main id="paper" class="paper" hidden><img class="logo" src="assets/association-logo.png"><div class="title"><h1>แบบสรุปการนำส่งเงินตามสำเนาใบเสร็จรับเงิน</h1><p>สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</p></div><div class="meta"><div class="box"><small>เลขที่รายงาน</small><b id="reportNo">-</b></div><div class="box"><small>วันที่จัดทำ</small><b id="reportDate">-</b></div></div><table class="tbl"><thead><tr><th style="width:11mm">ที่</th><th>เล่มที่-เลขที่</th><th>ประเภทรายการ</th><th>ผู้ชำระ/ผู้บริจาค</th><th class="num">มูลค่า</th></tr></thead><tbody id="rows"></tbody></table><div id="summary" class="summary"></div><div class="sign"><div class="signbox"><div class="line">ผู้นำส่งเงิน</div><div>............................................................</div></div></div><div class="foot"><span id="note">-</span><span id="printedAt"></span></div></main>
<script>
const API='https://sk-alumni-api.itpcmc2024.workers.dev',key=localStorage.getItem('sk_alumni_admin_key')||sessionStorage.getItem('sk_alumni_admin_key')||'',qs=new URLSearchParams(location.search),id=qs.get('id')||'',e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=v=>Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}),fmt=v=>new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(v))+' น.';
async function api(path,opt={}){const r=await fetch(API+path,{cache:'no-store',...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+key,...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw new Error(j.message||'HTTP '+r.status);return j}
async function load(){const j=await api('/api/admin/remittance-reports/'+encodeURIComponent(id)),d=j.data||{},r=d.report||{},items=d.items||[];reportNo.textContent=r.report_no||'-';reportDate.textContent=fmt(r.report_date||r.created_at);rows.innerHTML=items.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.receipt_no||'-')}</td><td>${e(x.receipt_type||'-')}</td><td>${e(x.payer_name||'-')}</td><td class="num">${money(x.amount)}</td></tr>`).join('');const sums={};items.forEach(x=>sums[x.receipt_type||'อื่นๆ']=(sums[x.receipt_type||'อื่นๆ']||0)+Number(x.amount||0));const total=items.reduce((n,x)=>n+Number(x.amount||0),0);summary.innerHTML=Object.entries(sums).map(([k,v])=>`<div class="row"><span>${e(k)}</span><b>${money(v)} บาท</b></div>`).join('')+`<div class="row total"><span>รวมทั้งสิ้น</span><b>${money(total)} บาท</b></div>`;note.textContent=r.note?'หมายเหตุ: '+r.note:'หมายเหตุ: -';printedAt.textContent='วันเวลาที่พิมพ์ '+fmt(new Date());paper.hidden=false}
printBtn.onclick=async()=>{try{await api('/api/admin/remittance-reports/'+encodeURIComponent(id)+'/print-log',{method:'POST',body:'{}'})}catch(e){}window.print()};if(!id||!key)Swal.fire({icon:'warning',title:'ไม่พบข้อมูลหรือ Admin Key'});else load().catch(err=>Swal.fire({icon:'error',title:'เปิดรายงานไม่สำเร็จ',text:err.message}));
</script></body></html>
