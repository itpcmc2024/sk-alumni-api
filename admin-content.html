<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Content</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.jpg"><div><div class="brand">จัดการข่าวสาร</div><div class="brand-sub">Admin · V2.0</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a><a class="active">ข่าวสาร</a></nav></div></header><main class="wrap"><div class="card" style="margin-top:28px"><form id="f" class="form"><div class="row2"><div class="field"><label>Admin API Key *</label><input id="key" class="control" type="password" required></div><div class="field"><label>หมวด *</label><select id="cat" class="control"><option>ข่าวสาร</option><option>ประกาศ</option><option>กิจกรรม</option></select></div></div><div class="field"><label>หัวข้อ *</label><input id="title" class="control" required></div><div class="field"><label>เนื้อหา *</label><textarea id="content" class="control" required></textarea></div><button class="btn">บันทึกข่าว</button></form></div><h2 class="section-title">รายการข่าว</h2><div id="list" class="list"></div></main><div id="foot"></div><script>foot.innerHTML=footer('Admin Content');async function refresh(){try{const j=await api('/api/news');list.innerHTML=(j.data||[]).map(n=>`<div class="item"><b>${e(n.title)}</b> <span class="badge active">${e(n.category)}</span><div class="sub">${fmtDate(n.publish_date)}</div></div>`).join('')||'<div class="item">ยังไม่มีข่าว</div>'}catch(err){list.innerHTML='<div class="item">'+e(err.message)+'</div>'}}f.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/news',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()},body:JSON.stringify({category:cat.value,title:title.value.trim(),content:content.value.trim()})});Swal.fire({icon:'success',title:'บันทึกแล้ว',timer:900,showConfirmButton:false});title.value='';content.value='';refresh()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};refresh();</script></body></html>
