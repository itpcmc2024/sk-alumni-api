<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Receipt Center</title><link rel="stylesheet" href="assets/site.css?v=2.6.29"><link rel="stylesheet" href="assets/module-nav.css?v=2.6.29"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 12px}.tab{border:1px solid #cfe4d9;background:#fff;color:#446259;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer}.tab.active{background:#08744c;color:#fff}.panel[hidden]{display:none!important}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto auto auto;gap:9px;align-items:center}.pagerline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.pagerbtn{border:1px solid #cfe4d9;background:#fff;color:#08744c;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}.pagerbtn:disabled{opacity:.4;cursor:not-allowed}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:900px}.tbl th,.tbl td{padding:11px;border-bottom:1px solid #e5eee9;text-align:left}.tbl th{background:#f1f8f4;color:#61776d}.mini{border:0;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer}.view{background:#e6f2ff;color:#1766a3}.print{background:#e1f8ec;color:#08744c}.batch{background:#08744c;color:#fff}.muted{font-size:12px;color:#7d8d86}.count{font-weight:800;color:#08744c}@media(max-width:800px){.toolbar{grid-template-columns:1fr}.tbl{min-width:760px}}</style><script id="sk-local-core-v2627">(function(){'use strict';const API_BASE='https://sk-alumni-api.itpcmc2024.workers.dev';window.SK=window.SK||{API:API_BASE,VERSION:'V2.6.29'};window.e=window.e||function(v){return String(v??'').replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]||c})};window.api=window.api||async function(path,opts={}){const r=await fetch(API_BASE+path,{cache:'no-store',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok||j.success===false){const er=new Error(j.message||j.error||('HTTP '+r.status));er.status=r.status;throw er}return j};window.fmtDate=window.fmtDate||function(v){if(!v)return'-';try{return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return String(v)}};window.footer=window.footer||function(moduleName){return '<footer class="admin-public-footer"><div class="apf-inner"><div class="apf-brand"><img class="apf-logo" src="assets/association-logo.png" alt="โลโก้สมาคม" width="52" height="52"><div><div class="apf-title">สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</div><div class="apf-sub">🌙 ศรัทธา · 📚 ความรู้ · 💚 สายสัมพันธ์</div></div></div><div class="apf-copy">© 2026 SK Alumni Member System by KimhanIkals<br>Admin Center · V2.6.29</div></div></footer>'};window.$id=window.$id||function(id){return document.getElementById(id)}})();</script></head><body><div id="sk-v2627-marker" style="display:none">V2.6.29</div><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">ศูนย์จัดการใบเสร็จ</div><div class="brand-sub">Admin · V2.6.29</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a><a href="admin-finance.html">ธุรกรรม</a><a class="active">ใบเสร็จ</a><a href="index.html">🏠 หน้าบ้าน</a></nav></div></header><main class="wrap"><div class="tabs"><button class="tab active" data-p="receipts">🧾 ใบเสร็จทั้งหมด</button><button class="tab" data-p="logs">🕘 Log การพิมพ์</button></div><section id="rp-receipts" class="panel card"><div class="toolbar"><input id="q" class="control" placeholder="ค้นหาเลขใบเสร็จ / รหัสสมาชิก / ชื่อ"><select id="rSort" class="control"><option value="desc">ใหม่ → เก่า</option><option value="asc">เก่า → ใหม่</option></select><select id="rSize" class="control"><option>10</option><option>20</option><option>50</option><option>100</option></select><button id="reload" class="btn alt">รีเฟรช</button><button id="printSelected" class="mini batch">🖨 พิมพ์ที่เลือก</button></div><p class="muted">เลือกได้หลายใบเพื่อพิมพ์ต่อเนื่องครั้งเดียว แต่ละใบจะเป็น A4 ที่มี ต้นฉบับ + สำเนา</p><div class="tablewrap"><table class="tbl"><thead><tr><th><input id="all" type="checkbox"></th><th>เลขใบเสร็จ</th><th>สมาชิก</th><th>รายการ</th><th>จำนวน</th><th>ออกใบเสร็จ</th><th>พิมพ์แล้ว</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagerline"><span id="rInfo" class="muted"></span><div><button id="rPrev" class="pagerbtn">ก่อนหน้า</button> <span id="rPage" class="muted"></span> <button id="rNext" class="pagerbtn">ถัดไป</button></div></div></section><section id="rp-logs" class="panel card" hidden><div class="toolbar"><input id="lq" class="control" placeholder="ค้นหา Log / ใบเสร็จ / ผู้พิมพ์"><select id="lSort" class="control"><option value="desc">ใหม่ → เก่า</option><option value="asc">เก่า → ใหม่</option></select><select id="lSize" class="control"><option>10</option><option>20</option><option>50</option><option>100</option></select><button id="reloadLog" class="btn alt">รีเฟรช</button><span></span></div><div class="tablewrap"><table class="tbl"><thead><tr><th>วันเวลาพิมพ์</th><th>ใบเสร็จ</th><th>Payment</th><th>ประเภท</th><th>Batch</th><th>ผู้พิมพ์</th></tr></thead><tbody id="logRows"></tbody></table></div><div class="pagerline"><span id="lInfo" class="muted"></span><div><button id="lPrev" class="pagerbtn">ก่อนหน้า</button> <span id="lPage" class="muted"></span> <button id="lNext" class="pagerbtn">ถัดไป</button></div></div></section></main><div id="foot"></div><script>
const q=document.getElementById('q'), rSort=document.getElementById('rSort'), rSize=document.getElementById('rSize'), reload=document.getElementById('reload'), printSelected=document.getElementById('printSelected'), all=document.getElementById('all'), rows=document.getElementById('rows'), rInfo=document.getElementById('rInfo'), rPrev=document.getElementById('rPrev'), rPage=document.getElementById('rPage'), rNext=document.getElementById('rNext');
const lq=document.getElementById('lq'), lSort=document.getElementById('lSort'), lSize=document.getElementById('lSize'), reloadLog=document.getElementById('reloadLog'), logRows=document.getElementById('logRows'), lInfo=document.getElementById('lInfo'), lPrev=document.getElementById('lPrev'), lPage=document.getElementById('lPage'), lNext=document.getElementById('lNext');
document.getElementById('foot').innerHTML=footer('Receipt Center');
const key=localStorage.getItem('sk_alumni_admin_key')||sessionStorage.getItem('sk_alumni_admin_key')||'';let R=[],L=[],rPageNo=1,lPageNo=1;
const auth=()=>({Authorization:'Bearer '+key}),money=v=>Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
async function load(){if(!key)return Swal.fire({icon:'warning',title:'กรุณาเข้าสู่ Admin ก่อน'});const [r,l]=await Promise.all([api('/api/admin/receipts',{headers:auth()}),api('/api/admin/receipt-print-logs',{headers:auth()})]);R=r.data||[];L=l.data||[];render();renderLogs()}
function fullname(x){return [x.prefix,x.first_name,x.last_name].filter(Boolean).join(' ')||x.full_name||'-'}
function sortTs(v){const t=new Date(v||0).getTime();return Number.isFinite(t)?t:0}
function render(){const t=q.value.trim().toLowerCase(),dir=rSort.value==='asc'?1:-1;let arr=R.filter(x=>!t||[x.receipt_no,x.payment_id,x.member_code,fullname(x)].join(' ').toLowerCase().includes(t)).sort((a,b)=>(sortTs(a.receipt_issued_at)-sortTs(b.receipt_issued_at))*dir);const size=Number(rSize.value||10),pages=Math.max(1,Math.ceil(arr.length/size));rPageNo=Math.min(rPageNo,pages);const page=arr.slice((rPageNo-1)*size,rPageNo*size);rows.innerHTML=page.map(x=>{const c=L.filter(l=>l.payment_id===x.payment_id).length;return `<tr><td><input class="pick" type="checkbox" value="${e(x.payment_id)}"></td><td><b>${e(x.receipt_no||'-')}</b><div class="muted">${e(x.payment_id)}</div></td><td>${e(fullname(x))}<div class="muted">${e(x.member_code)}</div></td><td>${e(x.payment_type||'-')}</td><td>${money(x.amount)}</td><td>${fmtDate(x.receipt_issued_at)}</td><td class="count">${c} ครั้ง</td><td><button class="mini view" onclick="window.open('receipt.html?id=${encodeURIComponent(x.payment_id)}','_blank')">ดู</button> <button class="mini print" onclick="one('${e(x.payment_id)}')">พิมพ์</button></td></tr>`}).join('')||'<tr><td colspan="8">ไม่พบใบเสร็จ</td></tr>';rInfo.textContent=`แสดง ${arr.length?((rPageNo-1)*size+1):0}-${Math.min(rPageNo*size,arr.length)} จาก ${arr.length} รายการ`;rPage.textContent=`หน้า ${rPageNo} / ${pages}`;rPrev.disabled=rPageNo<=1;rNext.disabled=rPageNo>=pages;all.checked=false}
function renderLogs(){const t=lq.value.trim().toLowerCase(),dir=lSort.value==='asc'?1:-1;let arr=L.filter(x=>!t||[x.log_id,x.receipt_no,x.payment_id,x.printed_by,x.batch_id].join(' ').toLowerCase().includes(t)).sort((a,b)=>(sortTs(a.printed_at)-sortTs(b.printed_at))*dir);const size=Number(lSize.value||10),pages=Math.max(1,Math.ceil(arr.length/size));lPageNo=Math.min(lPageNo,pages);const page=arr.slice((lPageNo-1)*size,lPageNo*size);logRows.innerHTML=page.map(x=>`<tr><td>${fmtDate(x.printed_at)}</td><td>${e(x.receipt_no||'-')}</td><td>${e(x.payment_id||'-')}</td><td>${e(x.print_type||'-')}</td><td>${e(x.batch_id||'-')}</td><td>${e(x.printed_by||'-')}</td></tr>`).join('')||'<tr><td colspan="6">ยังไม่มีประวัติการพิมพ์</td></tr>';lInfo.textContent=`แสดง ${arr.length?((lPageNo-1)*size+1):0}-${Math.min(lPageNo*size,arr.length)} จาก ${arr.length} รายการ`;lPage.textContent=`หน้า ${lPageNo} / ${pages}`;lPrev.disabled=lPageNo<=1;lNext.disabled=lPageNo>=pages}
window.one=id=>window.open('receipt.html?id='+encodeURIComponent(id),'_blank');
q.oninput=()=>{rPageNo=1;render()};lq.oninput=()=>{lPageNo=1;renderLogs()};rSort.onchange=rSize.onchange=()=>{rPageNo=1;render()};lSort.onchange=lSize.onchange=()=>{lPageNo=1;renderLogs()};rPrev.onclick=()=>{if(rPageNo>1){rPageNo--;render()}};rNext.onclick=()=>{rPageNo++;render()};lPrev.onclick=()=>{if(lPageNo>1){lPageNo--;renderLogs()}};lNext.onclick=()=>{lPageNo++;renderLogs()};
reload.onclick=reloadLog.onclick=load;all.onchange=()=>document.querySelectorAll('.pick').forEach(x=>x.checked=all.checked);printSelected.onclick=()=>{const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)return Swal.fire({icon:'warning',title:'กรุณาเลือกใบเสร็จ'});window.open('receipt-batch.html?ids='+encodeURIComponent(ids.join(',')),'_blank')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!=='rp-'+b.dataset.p)});load().catch(err=>Swal.fire({icon:'error',title:'โหลดข้อมูลไม่สำเร็จ',text:err.message}));
</script></body></html>
