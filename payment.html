<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ชำระค่าสมาชิก</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.jpg"><div><div class="brand">ชำระค่าสมาชิก</div><div class="brand-sub">SK Alumni Member System</div></div><nav class="nav"><a href="index.html">หน้าแรก</a><a href="status.html">ตรวจสอบสถานะ</a><a class="active" href="payment.html">ชำระค่าสมาชิก</a></nav></div></header><main class="wrap"><h1 class="section-title">💳 แจ้งชำระค่าสมาชิก</h1><div class="card"><div class="notice">กรอกรหัสสมาชิกก่อน ระบบจะตรวจสอบสมาชิก และบันทึกรายการชำระเข้าระบบ</div><form id="f" class="form" style="margin-top:18px"><div class="row2"><div class="field"><label>รหัสสมาชิก *</label><input id="code" class="control" required placeholder="69-SK0001"></div><div class="field"><label>หัวข้อการชำระ *</label><select id="topic" class="control" required><option value="membership">ชำระค่าสมาชิก</option></select></div></div><div class="row2"><div class="field"><label>จำนวนเงิน *</label><input id="amount" class="control" type="number" min="1" step="0.01" required></div><div class="field"><label>วันเวลาโอน *</label><input id="paidAt" class="control" type="datetime-local" required></div></div><div class="field"><label>ลิงก์หลักฐานการโอน (ถ้ามี)</label><input id="slipUrl" class="control" type="url" placeholder="https://..."></div><button class="btn" type="submit">ส่งข้อมูลการชำระ</button></form></div></main><div id="foot"></div><script>foot.innerHTML=footer('Payment');document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();try{const j=await api('/api/payments',{method:'POST',body:JSON.stringify({member_code:code.value.trim().toUpperCase(),topic_id:topic.value,amount:Number(amount.value),paid_at:new Date(paidAt.value).toISOString(),slip_url:slipUrl.value.trim()})});Swal.fire({icon:'success',title:'บันทึกรายการแล้ว',text:'เลขรายการ '+(j.payment_id||'')});ev.target.reset()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};</script></body></html>
