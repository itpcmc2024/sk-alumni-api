<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข่าวสาร | SK Alumni</title><link rel="stylesheet" href="assets/site.css?v=2.6.49"><style id="sk-v2627-safety">html,body{min-height:100%}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4fbf7;color:#405166}.wrap{width:min(1180px,94vw);margin:auto}.top{background:#fff;border-bottom:1px solid #dff0e6}.topin{display:flex;align-items:center;gap:16px;padding:12px 0}.logo{width:66px;height:66px;object-fit:contain}.brand{font-weight:800;color:#086a4b}.card{background:#fff;border:1px solid #dcebe4;border-radius:24px;padding:22px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:#0f9f6e;color:#fff;font-weight:800;padding:12px 18px;text-decoration:none}.control{width:100%;box-sizing:border-box}@media(max-width:700px){.topin{align-items:flex-start}.nav{display:none}}</style><link rel="stylesheet" href="assets/public-footer.css?v=2.6.49"></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">ข่าวสารและกิจกรรม</div><div class="brand-sub">SK Alumni Member System</div></div><nav class="nav"><a href="index.html">หน้าแรก</a></nav></div></header><main class="wrap"><h1 class="section-title">📣 ข่าวสารล่าสุด</h1><div id="list" class="list"><div class="card">กำลังโหลด...</div></div></main><div id="foot"></div><script>
const API='https://sk-alumni-api.itpcmc2024.workers.dev';const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));const fmt=v=>{try{return new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(v))+' น.'}catch{return String(v||'-')}};document.getElementById('foot').innerHTML='<footer class="sk-public-admin-footer"><div class="sk-public-admin-footer__in"><div class="sk-public-admin-footer__brand"><img src="assets/association-logo.png" alt="โลโก้สมาคม"><div class="sk-public-admin-footer__text"><div class="sk-public-admin-footer__name">สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</div><div class="sk-public-admin-footer__values">🌙 ศรัทธา · 📚 ความรู้ · 💚 สายสัมพันธ์</div></div></div><div class="sk-public-admin-footer__copy">© 2026 SK Alumni Member System by KimhanIkals - ข่าวสาร · V2.6.49</div></div></footer>';
(async()=>{try{const r=await fetch(API+'/api/news',{cache:'no-store'}),j=await r.json();if(!r.ok||j.success===false)throw new Error(j.message||'โหลดข่าวไม่สำเร็จ');const rows=j.data||[];document.getElementById('list').innerHTML=rows.length?rows.map(n=>`<article class="card"><span class="badge active">${esc(n.category||'ข่าวสาร')}</span><h2>${esc(n.title)}</h2><div style="color:#7a8797;font-size:13px">${fmt(n.publish_date)}</div><p style="line-height:1.8">${esc(n.content||'')}</p></article>`).join(''):'<div class="card">ยังไม่มีข่าวสาร</div>'}catch(e){document.getElementById('list').innerHTML='<div class="card">โหลดข่าวไม่สำเร็จ: '+esc(e.message)+'</div>'}})();</script></body></html>
