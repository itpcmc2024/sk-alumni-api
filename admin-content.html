<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Content</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script>

<style id="v26-global-nav">
.v26-homebar{max-width:1220px;margin:14px auto 0;padding:0 18px;display:flex;justify-content:flex-end}
.v26-homebtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
border:1px solid #bfe4cf;background:#f7fff9;color:#08744c;font-weight:800;text-decoration:none;
box-shadow:0 5px 14px rgba(28,111,74,.07)}
.v26-homebtn:hover{background:#eaf9f1}
@media(max-width:760px){.v26-homebar{justify-content:flex-end;margin-top:10px;padding-right:14px}.v26-homebtn{font-size:13px}}
</style>

<style id="v26-footer-mobile">
@media(max-width:760px){
  footer .wrap, .site-footer-in, .footin{
    text-align:center!important;
  }
  .site-footer-in, .footin{
    display:flex!important;
    flex-direction:column!important;
    align-items:center!important;
    justify-content:center!important;
    gap:18px!important;
  }
  .site-footer-brand, .footbrand{
    display:flex!important;
    flex-direction:row!important;
    align-items:center!important;
    justify-content:center!important;
    gap:14px!important;
    text-align:left!important;
    width:auto!important;
    max-width:94%!important;
  }
  .site-footer-brand img, .footbrand img, footer .footer-logo{
    width:72px!important;
    height:72px!important;
    flex:none!important;
    object-fit:contain!important;
    background:transparent!important;
    border:3px solid rgba(50,169,105,.22)!important;
    box-shadow:0 0 0 7px rgba(224,249,234,.65),0 8px 18px rgba(27,118,76,.14)!important;
    border-radius:50%!important;
    padding:3px!important;
  }
  .site-footer-version, .footcopy{
    text-align:center!important;
    width:100%!important;
    margin-top:0!important;
  }
}
</style>

<link rel="stylesheet" href="assets/module-nav.css">
</head><body>
<div class="v26-homebar"><a class="v26-homebtn" href="index.html">← กลับหน้าหลัก</a></div>

<header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">จัดการข่าวสาร</div><div class="brand-sub">Admin · V2.6.8</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a><a class="active">ข่าวสาร</a></nav></div></header><main class="wrap"><div class="card" style="margin-top:28px"><form id="f" class="form"><div class="row2"><div class="field"><label>Admin API Key *</label><input id="key" class="control" type="password" required></div><div class="field"><label>หมวด *</label><select id="cat" class="control"><option>ข่าวสาร</option><option>ประกาศ</option><option>กิจกรรม</option></select></div></div><div class="field"><label>หัวข้อ *</label><input id="title" class="control" required></div><div class="field"><label>เนื้อหา *</label><textarea id="content" class="control" required></textarea></div><button class="btn">บันทึกข่าว</button></form></div><h2 class="section-title">รายการข่าว</h2><div id="list" class="list"></div></main><div id="foot"></div><script>foot.innerHTML=footer('Admin Content');async function refresh(){try{const j=await api('/api/news');list.innerHTML=(j.data||[]).map(n=>`<div class="item"><b>${e(n.title)}</b> <span class="badge active">${e(n.category)}</span><div class="sub">${fmtDate(n.publish_date)}</div></div>`).join('')||'<div class="item">ยังไม่มีข่าว</div>'}catch(err){list.innerHTML='<div class="item">'+e(err.message)+'</div>'}}f.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/news',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()},body:JSON.stringify({category:cat.value,title:title.value.trim(),content:content.value.trim()})});Swal.fire({icon:'success',title:'บันทึกแล้ว',timer:900,showConfirmButton:false});title.value='';content.value='';refresh()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};refresh();</script><script src="assets/module-nav.js"></script>
</body></html>
