<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Settings</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.jpg"><div><div class="brand">ตั้งค่าระบบ</div><div class="brand-sub">Admin · V2.0</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a></nav></div></header><main class="wrap"><div class="card" style="margin-top:28px"><form id="f" class="form"><div class="field"><label>Admin API Key *</label><input id="key" class="control" type="password" required></div><div class="field"><label>ชื่อระบบ</label><input id="app" class="control"></div><div class="row2"><div class="field"><label>ค่าสมาชิกรายปี</label><input id="fee" class="control" type="number"></div><div class="field"><label>PromptPay</label><input id="promptpay" class="control"></div></div><div class="field"><label>อีเมลติดต่อ</label><input id="email" class="control" type="email"></div><button class="btn">บันทึกการตั้งค่า</button></form></div></main><div id="foot"></div><script>foot.innerHTML=footer('Admin Settings');async function loadSettings(){try{const j=await api('/api/settings/public');const d=j.data||{};app.value=d.APP_NAME||'';fee.value=d.MEMBERSHIP_FEE_YEARLY||'';promptpay.value=d.PROMPTPAY||'';email.value=d.CONTACT_EMAIL||''}catch{}}f.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/settings',{method:'PUT',headers:{Authorization:'Bearer '+key.value.trim()},body:JSON.stringify({APP_NAME:app.value.trim(),MEMBERSHIP_FEE_YEARLY:fee.value,PROMPTPAY:promptpay.value.trim(),CONTACT_EMAIL:email.value.trim()})});Swal.fire({icon:'success',title:'บันทึกแล้ว'})}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};loadSettings();</script></body></html>
