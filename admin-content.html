<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Content</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script>
<style id="v24-global-nav">
.v24-homebar{max-width:1220px;margin:14px auto 0;padding:0 18px;display:flex;justify-content:flex-start}
.v24-homebtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
border:1px solid #bfe4cf;background:#f7fff9;color:#08744c;font-weight:800;text-decoration:none;
box-shadow:0 5px 14px rgba(28,111,74,.07)}
.v24-homebtn:hover{background:#eaf9f1}
@media(max-width:760px){.v24-homebar{justify-content:center;margin-top:10px}.v24-homebtn{font-size:13px}}
</style>

</head><body>
<div class="v24-homebar"><a class="v24-homebtn" href="index.html">← กลับหน้าหลัก</a></div>
<header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">จัดการข่าวสาร</div><div class="brand-sub">Admin · V2.0</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a><a class="active">ข่าวสาร</a></nav></div></header><main class="wrap"><div class="card" style="margin-top:28px"><form id="f" class="form"><div class="row2"><div class="field"><label>Admin API Key *</label><input id="key" class="control" type="password" required></div><div class="field"><label>หมวด *</label><select id="cat" class="control"><option>ข่าวสาร</option><option>ประกาศ</option><option>กิจกรรม</option></select></div></div><div class="field"><label>หัวข้อ *</label><input id="title" class="control" required></div><div class="field"><label>เนื้อหา *</label><textarea id="content" class="control" required></textarea></div><button class="btn">บันทึกข่าว</button></form></div><h2 class="section-title">รายการข่าว</h2><div id="list" class="list"></div></main><div id="foot"></div><script>foot.innerHTML=footer('Admin Content');async function refresh(){try{const j=await api('/api/news');list.innerHTML=(j.data||[]).map(n=>`<div class="item"><b>${e(n.title)}</b> <span class="badge active">${e(n.category)}</span><div class="sub">${fmtDate(n.publish_date)}</div></div>`).join('')||'<div class="item">ยังไม่มีข่าว</div>'}catch(err){list.innerHTML='<div class="item">'+e(err.message)+'</div>'}}f.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/news',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()},body:JSON.stringify({category:cat.value,title:title.value.trim(),content:content.value.trim()})});Swal.fire({icon:'success',title:'บันทึกแล้ว',timer:900,showConfirmButton:false});title.value='';content.value='';refresh()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};refresh();</script></body></html>
