<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บริจาค</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script>
<style id="v24-global-nav">
.v24-homebar{max-width:1220px;margin:14px auto 0;padding:0 18px;display:flex;justify-content:flex-start}
.v24-homebtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
border:1px solid #bfe4cf;background:#f7fff9;color:#08744c;font-weight:800;text-decoration:none;
box-shadow:0 5px 14px rgba(28,111,74,.07)}
.v24-homebtn:hover{background:#eaf9f1}
@media(max-width:760px){.v24-homebar{justify-content:center;margin-top:10px}.v24-homebtn{font-size:13px}}
</style>

</head><body>
<div class="v24-homebar"><a class="v24-homebtn" href="index.html">← กลับหน้าหลัก</a></div>
<header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">ร่วมบริจาค</div><div class="brand-sub">SK Alumni Member System</div></div><nav class="nav"><a href="index.html">หน้าแรก</a><a class="active" href="donation.html">บริจาค</a><a href="news.html">ข่าวสาร</a></nav></div></header><main class="wrap"><h1 class="section-title">💝 ร่วมสนับสนุนสมาคม</h1><div class="card"><form id="f" class="form"><div class="row2"><div class="field"><label>หัวข้อบริจาค *</label><select id="topic" class="control" required><option value="general">กิจกรรมสมาคม</option><option value="education">กองทุนการศึกษา</option></select></div><div class="field"><label>จำนวนเงิน *</label><input id="amount" class="control" type="number" min="1" step="0.01" required></div></div><div class="row2"><div class="field"><label>รหัสสมาชิก (ถ้ามี)</label><input id="code" class="control" placeholder="69-SK0001"></div><div class="field"><label>ชื่อผู้บริจาค *</label><input id="donor" class="control" required></div></div><div class="row2"><div class="field"><label>โทรศัพท์</label><input id="phone" class="control" inputmode="numeric"></div><div class="field"><label>Email</label><input id="email" class="control" type="email"></div></div><div class="field"><label>ลิงก์หลักฐานการโอน (ถ้ามี)</label><input id="slipUrl" class="control" type="url"></div><button class="btn" type="submit">ส่งข้อมูลบริจาค</button></form></div></main><div id="foot"></div><script>foot.innerHTML=footer('Donation');f.onsubmit=async ev=>{ev.preventDefault();try{const j=await api('/api/donations',{method:'POST',body:JSON.stringify({member_code:code.value.trim().toUpperCase()||null,topic_id:topic.value,amount:Number(amount.value),donor_name:donor.value.trim(),phone:phone.value.trim(),email:email.value.trim(),slip_url:slipUrl.value.trim()})});Swal.fire({icon:'success',title:'ขอบคุณสำหรับการสนับสนุน',text:'เลขรายการ '+(j.donation_id||'')});ev.target.reset()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};</script></body></html>
