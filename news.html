<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข่าวสาร</title><link rel="stylesheet" href="assets/site.css"><script src="assets/site.js"></script></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.jpg"><div><div class="brand">ข่าวสารและกิจกรรม</div><div class="brand-sub">SK Alumni Member System</div></div><nav class="nav"><a href="index.html">หน้าแรก</a><a class="active" href="news.html">ข่าวสาร</a></nav></div></header><main class="wrap"><h1 class="section-title">📣 ข่าวสารล่าสุด</h1><div id="list" class="list"><div class="card">กำลังโหลด...</div></div></main><div id="foot"></div><script>foot.innerHTML=footer('News');(async()=>{try{const j=await api('/api/news');const rows=j.data||[];list.innerHTML=rows.length?rows.map(n=>`<article class="card"><span class="badge active">${e(n.category||'ข่าวสาร')}</span><h2>${e(n.title)}</h2><div style="color:#7a8797;font-size:13px">${fmtDate(n.publish_date)}</div><p style="line-height:1.8">${e(n.content||'')}</p></article>`).join(''):'<div class="card">ยังไม่มีข่าวสาร</div>'}catch(err){list.innerHTML=`<div class="card">โหลดข่าวไม่สำเร็จ: ${e(err.message)}</div>`}})();</script></body></html>
