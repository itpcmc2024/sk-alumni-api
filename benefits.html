<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สิทธิประโยชน์</title><link rel="stylesheet" href="assets/site.css"><script src="assets/site.js"></script></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.jpg"><div><div class="brand">สิทธิประโยชน์สมาชิก</div><div class="brand-sub">SK Alumni Member System</div></div><nav class="nav"><a href="index.html">หน้าแรก</a><a class="active" href="benefits.html">สิทธิประโยชน์</a><a href="member.html">ข้อมูลสมาชิก</a></nav></div></header><main class="wrap"><h1 class="section-title">🎁 สิทธิประโยชน์สำหรับสมาชิก</h1><div id="list" class="grid"></div></main><div id="foot"></div><script>foot.innerHTML=footer('Benefits');(async()=>{try{const j=await api('/api/benefits');const rows=j.data||[];list.innerHTML=rows.length?rows.map(x=>`<div class="card module"><div class="icon">🎁</div><h3>${e(x.title)}</h3><p>${e(x.description||'')}</p><div class="sub">${x.end_date?'ถึง '+e(x.end_date):'ไม่มีวันสิ้นสุด'}</div></div>`).join(''):'<div class="card">ยังไม่มีสิทธิประโยชน์ที่เปิดใช้งาน</div>'}catch(err){list.innerHTML=`<div class="card">โหลดข้อมูลไม่สำเร็จ: ${e(err.message)}</div>`}})();</script></body></html>
