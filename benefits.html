<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สิทธิประโยชน์ | SK Alumni</title><link rel="stylesheet" href="assets/site.css?v=2.6.56"><style id="sk-v2627-safety">html,body{min-height:100%}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4fbf7;color:#405166}.wrap{width:min(1180px,94vw);margin:auto}.top{background:#fff;border-bottom:1px solid #dff0e6}.topin{display:flex;align-items:center;gap:16px;padding:12px 0}.logo{width:66px;height:66px;object-fit:contain}.brand{font-weight:800;color:#086a4b}.card{background:#fff;border:1px solid #dcebe4;border-radius:24px;padding:22px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:#0f9f6e;color:#fff;font-weight:800;padding:12px 18px;text-decoration:none}.control{width:100%;box-sizing:border-box}@media(max-width:700px){.topin{align-items:flex-start}.nav{display:none}}</style><link rel="stylesheet" href="assets/public-footer.css?v=2.6.56"><link rel="stylesheet" href="assets/module-nav.css?v=2.6.56"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script defer src="assets/ui-feedback.js?v=2.6.56"></script></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">สิทธิประโยชน์สมาชิก</div><div class="brand-sub">SK Alumni Member System</div></div><nav class="nav"><a href="index.html">หน้าแรก</a></nav></div></header><main class="wrap sk-public-content-frame"><h1 class="section-title">🎁 สิทธิประโยชน์สำหรับสมาชิก</h1><div class="card" style="margin-bottom:18px"><div class="row2"><input id="bCode" class="control" placeholder="รหัสสมาชิก เช่น 69-SK0001"><input id="bIdentity" class="control" placeholder="อีเมล หรือ เบอร์โทรศัพท์"></div><button id="bLogin" class="btn" style="margin-top:12px">เข้าสู่ระบบสิทธิประโยชน์</button><div id="memberGreeting" style="display:none;margin-top:14px"></div></div><div id="list" class="grid"></div></main><div id="foot"></div><script>
const API='https://sk-alumni-api.itpcmc2024.workers.dev';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));document.getElementById('foot').innerHTML='<footer class="sk-public-admin-footer"><div class="sk-public-admin-footer__in"><div class="sk-public-admin-footer__brand"><img src="assets/association-logo.png" alt="โลโก้สมาคม"><div class="sk-public-admin-footer__text"><div class="sk-public-admin-footer__name">สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</div><div class="sk-public-admin-footer__values">🌙 ศรัทธา · 📚 ความรู้ · 💚 สายสัมพันธ์</div></div></div><div class="sk-public-admin-footer__copy">© 2026 SK Alumni Member System by KimhanIkals - สิทธิประโยชน์ · V2.6.56</div></div></footer>';
async function login(){const code=$('bCode').value.trim().toUpperCase(),identity=$('bIdentity').value.trim();if(!code||!identity)return skAlert('กรุณากรอกข้อมูลให้ครบ');try{const r=await fetch(API+'/api/member/benefits-info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({member_code:code,identity})}),j=await r.json();if(!r.ok||j.success===false)throw new Error(j.message||'เข้าสู่ระบบไม่สำเร็จ');const m=j.data||{};$('memberGreeting').style.display='block';$('memberGreeting').innerHTML='<b>ยินดีต้อนรับ '+esc([m.prefix,m.first_name,m.last_name].filter(Boolean).join(' ')||m.arabic_name||code)+'</b><br><a class="btn" href="member.html?code='+encodeURIComponent(m.member_code||code)+'">ดูข้อมูลและสิทธิประโยชน์ของฉัน</a>'}catch(e){skAlert(e.message)}}$('bLogin').onclick=login;
(async()=>{try{const r=await fetch(API+'/api/benefits',{cache:'no-store'}),j=await r.json();if(!r.ok||j.success===false)throw new Error(j.message||'โหลดข้อมูลไม่สำเร็จ');const rows=j.data||[];$('list').innerHTML=rows.length?rows.map(x=>`<div class="card module"><div class="icon">🎁</div><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p></div>`).join(''):'<div class="card">ยังไม่มีสิทธิประโยชน์</div>'}catch(e){$('list').innerHTML='<div class="card">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message)+'</div>'}})();</script><script defer src="assets/module-nav.js?v=2.6.56"></script></body></html>
