</head><body>
<div class="v26-homebar"><a class="v26-homebtn" href="index.html">← กลับหน้าหลัก</a></div>

<header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.png"><div><div class="brand">จัดการสิทธิประโยชน์</div><div class="brand-sub">Admin · V2.6.24</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a></nav></div></header><main class="wrap"><div class="subtabs"><button class="subtab active" data-p="create">➕ เพิ่มสิทธิ</button><button class="subtab" data-p="usage">📝 บันทึกการใช้สิทธิ</button><button class="subtab" data-p="list">📋 สิทธิที่เปิดใช้งาน</button></div><div id="bp-create" class="subpanel"><div class="card" style="margin-top:0"><form id="f" class="form"><div class="field"><label>Admin API Key *</label><input id="key" class="control" type="password" required></div><div class="field"><label>ชื่อสิทธิประโยชน์ *</label><input id="title" class="control" required></div><div class="field"><label>รายละเอียด</label><textarea id="desc" class="control"></textarea></div><div class="row2"><div class="field"><label>เริ่ม</label><input id="start" type="date" class="control"></div><div class="field"><label>สิ้นสุด</label><input id="end" type="date" class="control"></div></div><button class="btn">เพิ่มสิทธิประโยชน์</button></form></div></div><div id="bp-usage" class="subpanel" hidden><h2 class="section-title">📝 บันทึกการใช้สิทธิประโยชน์ของสมาชิก</h2><div class="card"><form id="usageForm" class="form"><div class="row2"><div class="field"><label>รหัสสมาชิก *</label><input id="usageMember" class="control" required placeholder="69-SK0001"></div><div class="field"><label>สิทธิประโยชน์ *</label><select id="usageBenefit" class="control" required><option value="">-- เลือกสิทธิประโยชน์ --</option></select></div></div><div class="row2"><div class="field"><label>วันที่ใช้สิทธิ์</label><input id="usageDate" type="datetime-local" class="control"></div><div class="field"><label>มูลค่า (ถ้ามี)</label><input id="usageAmount" type="number" min="0" step="0.01" value="0" class="control"></div></div><div class="field"><label>หมายเหตุ</label><textarea id="usageNote" class="control"></textarea></div><button class="btn">บันทึกการใช้สิทธิ์</button></form></div></div><div id="bp-list" class="subpanel" hidden><h2 class="section-title">สิทธิที่เปิดใช้งาน</h2><div id="list" class="list"></div></div></main><div id="foot"></div><script>document.getElementById('foot').innerHTML=footer('Admin Benefits');let benefitRows=[];async function refresh(){try{const j=await api('/api/benefits');benefitRows=j.data||[];document.getElementById('list').innerHTML=benefitRows.map(x=>`<div class="item"><b>${e(x.title)}</b><div>${e(x.description||'')}</div></div>`).join('')||'<div class="item">ยังไม่มีรายการ</div>';usageBenefit.innerHTML='<option value="">-- เลือกสิทธิประโยชน์ --</option>'+benefitRows.map(x=>`<option value="${e(x.benefit_id)}">${e(x.title)}</option>`).join('')}catch(err){document.getElementById('list').innerHTML='<div class="item">'+e(err.message)+'</div>'}}document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/benefits',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()},body:JSON.stringify({title:title.value.trim(),description:desc.value.trim(),start_date:start.value||null,end_date:end.value||null})});Swal.fire({icon:'success',title:'บันทึกแล้ว',timer:900,showConfirmButton:false});ev.target.reset();refresh()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};usageForm.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/benefit-usage',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()},body:JSON.stringify({member_code:usageMember.value.trim().toUpperCase(),benefit_id:usageBenefit.value,used_at:usageDate.value?new Date(usageDate.value).toISOString():null,amount:Number(usageAmount.value||0),note:usageNote.value.trim(),recorded_by:'admin'})});Swal.fire({icon:'success',title:'บันทึกการใช้สิทธิ์แล้ว',timer:1200,showConfirmButton:false});ev.target.reset();usageAmount.value=0}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subtab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.subpanel').forEach(x=>x.hidden=x.id!=='bp-'+b.dataset.p)});refresh();</script><script defer src="assets/module-nav.js?v=2.6.24"></script>
</body></html>
