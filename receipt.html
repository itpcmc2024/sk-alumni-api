<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ใบเสร็จรับเงิน | SK Alumni</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#edf8f2;color:#29483e;font-family:'Noto Sans Thai',sans-serif}.actions{width:210mm;max-width:94vw;margin:12px auto;display:flex;justify-content:flex-end;gap:8px}.btn{border:1px solid #cfe4d9;border-radius:10px;padding:9px 14px;background:#fff;color:#08744c;font-weight:800;cursor:pointer}.primary{background:#08744c;color:#fff}.a4{width:210mm;height:297mm;margin:0 auto 24px;background:#fff;padding:8mm 12mm;box-shadow:0 12px 40px #2342;overflow:hidden}.copy{height:137mm;position:relative;padding:5mm 4mm 4mm}.cut{height:7mm;border-top:1px dashed #96b4a5;display:flex;align-items:center;justify-content:center;color:#8aa094;font-size:10px}.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:600 64px Mitr,sans-serif;color:rgba(8,116,76,.055);transform:rotate(-24deg)}.head{display:grid;grid-template-columns:52px 1fr 112px;gap:10px;align-items:center;border-bottom:2px solid #08744c;padding-bottom:7px}.logo{width:48px;height:48px;object-fit:contain}.org h1{font:600 17px Mitr,sans-serif;color:#08744c;margin:0}.org p{font-size:10px;color:#6b8076;margin:2px 0 0}.doctype{text-align:right}.doctype b{font:600 20px Mitr;color:#08744c}.doctype span{display:block;font-size:10px;color:#71837b}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.box{border:1px solid #d6e9df;background:#f7fcf9;border-radius:8px;padding:6px 8px;font-size:11px}.box small,.cell small{display:block;color:#7a8b83;font-weight:700}.payer{display:grid;grid-template-columns:1.2fr .8fr .8fr 1.2fr;gap:6px;border:1px solid #d6e9df;border-radius:9px;padding:7px;margin-bottom:8px}.cell{font-size:11px;min-width:0}.addr{grid-column:1/-1}.items{width:100%;border-collapse:collapse;font-size:11px}.items th,.items td{border:1px solid #d6e9df;padding:6px 7px}.items th{background:#edf8f2;text-align:left}.items th:last-child,.items td:last-child{text-align:right;width:90px}.total{display:grid;grid-template-columns:1fr 210px;gap:10px;margin-top:7px;align-items:start}.words{font-size:10px;color:#5e7068;padding:5px}.totalbox{border:1px solid #d6e9df;background:#f7fcf9;border-radius:8px;padding:6px 8px;font-size:11px}.trow{display:flex;justify-content:space-between}.trow strong{color:#08744c;font:600 16px Mitr}.verify{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;font-size:10px}.sig{text-align:center;padding-top:18px}.sig:before{content:'';display:block;width:150px;border-top:1px solid #8ba096;margin:0 auto 3px}.foot{position:absolute;left:4mm;right:4mm;bottom:1mm;display:flex;justify-content:space-between;gap:8px;font-size:8.5px;color:#809188}.printmeta{font-weight:700;color:#526b60}@media(max-width:850px){.a4{width:94vw;height:auto;min-height:0}.copy{height:auto;min-height:620px}.actions{width:94vw}.payer{grid-template-columns:1fr 1fr}}@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.actions{display:none}.a4{width:210mm;height:297mm;margin:0;padding:8mm 12mm;box-shadow:none;page-break-after:always}.copy{height:137mm}.cut{height:7mm}}
</style></head><body><div class="actions"><button class="btn" onclick="window.close()">ปิด</button><button class="btn primary" id="printBtn">🖨 พิมพ์ต้นฉบับ + สำเนา</button></div><main id="a4" class="a4" hidden><section id="original" class="copy"></section><div class="cut">✂ ตัดตามเส้น — ต้นฉบับ / สำเนา</div><section id="copy" class="copy"></section></main><script>
const API=SK.API,$=x=>document.getElementById(x),id=new URLSearchParams(location.search).get('id'),key=localStorage.getItem('sk_alumni_admin_key')||sessionStorage.getItem('sk_alumni_admin_key')||'';let D=null,printCount=0;const esc=e;function money(v){return Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาท'}function fmt(v,sec=false){if(!v)return'-';return new Intl.DateTimeFormat('th-TH',{dateStyle:'long',timeStyle:sec?'medium':'short'}).format(new Date(v))}function addr(d){return [d.address_line,d.subdistrict&&'ต.'+d.subdistrict,d.district&&'อ.'+d.district,d.province&&'จ.'+d.province,d.postal_code].filter(Boolean).join(' ')||'-'}function bahtText(n){const v=Number(n||0);if(!Number.isFinite(v))return'-';return 'จำนวนเงิน '+v.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาทถ้วน'}async function req(path,opt={}){const r=await fetch(API+path,{cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||'HTTP '+r.status);return j}function tpl(label,d,count){const st=d.settings||{},name=[d.prefix,d.first_name,d.last_name].filter(Boolean).join(' ')||d.full_name||'-';return `<div class="wm">${label}</div><div class="head"><img class="logo" src="assets/association-logo.png"><div class="org"><h1>สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</h1><p data-app-name>${esc(st.APP_NAME||'SK Alumni Member System')}</p></div><div class="doctype"><b>ใบเสร็จรับเงิน</b><span>${label}</span></div></div><div class="meta"><div class="box"><small>เลขที่ใบเสร็จ</small>${esc(d.receipt_no||'-')}</div><div class="box"><small>วันที่ออกใบเสร็จ</small>${esc(fmt(d.receipt_issued_at,true))}</div></div><div class="payer"><div class="cell"><small>ชื่อ-สกุล</small>${esc(name)}</div><div class="cell"><small>รหัสสมาชิก</small>${esc(d.member_code||'-')}</div><div class="cell"><small>โทรศัพท์</small>${esc(d.phone||'-')}</div><div class="cell"><small>อีเมล</small>${esc(d.email||'-')}</div><div class="cell addr"><small>ที่อยู่</small>${esc(addr(d))}</div></div><table class="items"><thead><tr><th>รายการ</th><th>รายละเอียด / อ้างอิง</th><th>จำนวนเงิน</th></tr></thead><tbody><tr><td>${esc(d.payment_type||'ค่าบำรุงสมาคมศิษย์เก่าฯ รายปี')}</td><td>${esc(d.payment_id||'-')} · โอน ${esc(fmt(d.paid_at,true))}</td><td>${esc(money(d.amount))}</td></tr></tbody></table><div class="total"><div class="words">${esc(bahtText(d.amount))}<br>รับชำระผ่าน ${esc([st.BANK_NAME,st.BANK_ACCOUNT_NO,st.BANK_ACCOUNT_NAME].filter(Boolean).join(' · ')||'PromptPay')}</div><div class="totalbox"><div class="trow"><span>รวมเงิน</span><strong>${esc(money(d.amount))}</strong></div></div></div><div class="verify"><div>ตรวจสอบโดย: <b>${esc(d.verified_by||'admin')}</b><br>ตรวจเมื่อ: ${esc(fmt(d.verified_at,true))}</div><div class="sig">ผู้รับเงิน / เจ้าหน้าที่สมาคมฯ</div></div><div class="foot"><span>© 2026 SK Alumni Member System by Kimhan · Receipt V2.6.16</span><span class="printmeta">พิมพ์ครั้งที่ ${count} · วันที่พิมพ์ ${esc(fmt(new Date(),true))}</span></div>`}async function render(){const j=await req('/api/admin/payments/'+encodeURIComponent(id)+'/receipt',{headers:{Authorization:'Bearer '+key}});D=j.data;const logs=await req('/api/admin/receipt-print-logs',{headers:{Authorization:'Bearer '+key}}).catch(()=>({data:[]}));printCount=(logs.data||[]).filter(x=>x.payment_id===id).length+1;original.innerHTML=tpl('ต้นฉบับ',D,printCount);copy.innerHTML=tpl('สำเนา',D,printCount);a4.hidden=false}async function logPrint(){await req('/api/admin/receipt-print-logs',{method:'POST',headers:{Authorization:'Bearer '+key},body:JSON.stringify({payment_ids:[id],print_type:'single-original-copy',printed_by:'admin',user_agent:navigator.userAgent})})}printBtn.onclick=async()=>{try{await logPrint()}catch(e){const ok=await Swal.fire({icon:'warning',title:'บันทึก Log ไม่สำเร็จ',text:e.message,showCancelButton:true,confirmButtonText:'พิมพ์ต่อ',cancelButtonText:'ยกเลิก'});if(!ok.isConfirmed)return}window.print()};if(!id||!key)Swal.fire({icon:'warning',title:'ไม่พบข้อมูลหรือ Admin Key'});else render().catch(err=>Swal.fire({icon:'error',title:'เปิดใบเสร็จไม่สำเร็จ',text:err.message}));
</script></body></html>
