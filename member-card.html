<!doctype html><html lang="th"><head><link rel="preconnect" href="https://sk-alumni-api.itpcmc2024.workers.dev" crossorigin><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข้อมูลบัตรสมาชิก | SK Alumni</title><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#eefbf4,#f8fbff 58%,#fff9eb);color:#334155}.wrap{width:min(820px,94vw);margin:32px auto}.card{background:#fff;border:1px solid #dcece3;border-radius:28px;padding:clamp(20px,4vw,34px);box-shadow:0 18px 50px rgba(47,105,80,.08)}.head{text-align:center;border-bottom:1px solid #dbece3;padding-bottom:22px}.head img{width:94px;height:94px;object-fit:contain}.head h1{font:600 clamp(26px,5vw,38px) Mitr;color:#08744c;margin:8px 0 2px}.sub{color:#718096}.member{display:grid;grid-template-columns:135px 1fr;gap:24px;align-items:center;margin:26px 0}.photo{width:135px;height:160px;object-fit:cover;border-radius:18px;border:1px solid #d9e7df;background:#eff8f3}.name{font:600 28px Mitr;color:#19493b}.code{font:600 25px Mitr;color:#08744c;margin:4px 0}.badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:#e9f9ef;color:#08744c;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info{border:1px solid #e1ece6;border-radius:15px;padding:14px;background:#fbfefc}.info b{display:block;color:#668176;font-size:12px;margin-bottom:5px}.wide{grid-column:1/-1}.foot{text-align:center;color:#789087;font-size:12px;margin-top:20px}.home{display:inline-flex;margin-top:18px;padding:10px 16px;border-radius:999px;border:1px solid #c7e6d6;color:#08744c;text-decoration:none;font-weight:800}@media(max-width:620px){.member{grid-template-columns:1fr;text-align:center}.photo{margin:auto}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style><script defer src="assets/ui-feedback.js?v=2.7.04"></script><link rel="stylesheet" href="assets/responsive-v2685.css?v=2.7.04"></head><body><main class="wrap"><section class="card"><div class="head"><img src="assets/association-logo.png"><h1>ข้อมูลบัตรสมาชิก</h1><div class="sub">สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</div></div><div id="content"><div style="padding:40px;text-align:center;color:#718096">กำลังตรวจสอบ QR...</div></div><div class="foot">ข้อมูลนี้เปิดผ่าน QR บนบัตรสมาชิกดิจิทัล · SK Alumni Member System V2.7.04<br><a class="home" href="index.html">🏠 หน้าแรก</a></div></section></main><script>
const API='https://sk-alumni-api.itpcmc2024.workers.dev',esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function name(m){const f=[m.prefix,m.first_name,m.last_name].filter(Boolean).join(' ').trim();return f||m.full_name||'-'}function fmt(v){if(!v)return'-';try{return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium'}).format(new Date(v))}catch{return v}}async function init(){const q=new URLSearchParams(location.search),code=(q.get('code')||'').toUpperCase(),token=q.get('token')||'';if(!code||!token)return Swal.fire({icon:'warning',title:'QR ไม่ถูกต้อง'});try{const r=await fetch(API+'/api/member/card/'+encodeURIComponent(code)+'?token='+encodeURIComponent(token)),j=await r.json();if(!r.ok||j.success===false)throw new Error(j.message||'เปิดข้อมูลไม่สำเร็จ');const m=j.data||{},a=m.address||{},bk=String(a.province||'').includes('กรุงเทพ'),addr=[a.address_line,bk?'แขวง '+(a.subdistrict||''):'ตำบล '+(a.subdistrict||''),bk?'เขต '+(a.district||''):'อำเภอ '+(a.district||''),'จังหวัด '+(a.province||''),a.postal_code].filter(x=>x&&!/\s-$/.test(x)).join(' · ');content.innerHTML=`<div class="member"><img class="photo" src="${m.photo_data||'assets/cute-register.jpg'}"><div><div class="name">${esc(name(m))}</div><div class="code">${esc(m.member_code||'')}</div><span class="badge">${m.status==='active'?'สมาชิกสมบูรณ์':esc(m.status||'-')}</span></div></div><div class="grid"><div class="info"><b>เบอร์โทรศัพท์</b>${esc(m.phone||'-')}</div><div class="info"><b>อีเมล</b>${esc(m.email||'-')}</div><div class="info"><b>เริ่มเป็นสมาชิก</b>${esc(fmt(m.member_start))}</div><div class="info"><b>สิ้นสุดสมาชิก</b>${esc(fmt(m.member_expire))}</div><div class="info wide"><b>ที่อยู่</b>${esc(addr||'-')}</div></div>`}catch(e){content.innerHTML='<div style="padding:40px;text-align:center;color:#b45309">'+esc(e.message)+'</div>'}}init();</script><script defer src="assets/module-nav.js?v=2.7.04"></script></body></html>
