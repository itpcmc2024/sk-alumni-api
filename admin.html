<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SK Alumni - Admin Member</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    .modal-scroll {
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

<!-- =====================================================
     HEADER
===================================================== -->
<header class="border-b border-slate-800 bg-slate-900/95 sticky top-0 z-30">

  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

    <div>
      <h1 class="text-xl md:text-2xl font-bold">
        SK Alumni Member
      </h1>

      <p class="text-sm text-slate-400">
        ระบบจัดการสมาชิก
      </p>
    </div>

    <div class="flex items-center gap-2">

      <span
        id="adminStatus"
        class="hidden md:inline-flex px-3 py-1 rounded-full
               bg-emerald-950 text-emerald-300
               border border-emerald-800 text-sm"
      >
        Admin
      </span>

      <button
        onclick="logoutAdmin()"
        class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm"
      >
        ออกจากระบบ
      </button>

    </div>

  </div>

</header>


<!-- =====================================================
     LOGIN
===================================================== -->
<section
  id="loginSection"
  class="min-h-[80vh] flex items-center justify-center px-4"
>

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">

    <div class="text-center mb-6">

      <div
        class="mx-auto w-14 h-14 rounded-2xl
               bg-indigo-950 text-indigo-300
               flex items-center justify-center mb-4"
      >
        <i data-lucide="shield-check"></i>
      </div>

      <h2 class="text-2xl font-bold">
        ผู้ดูแลระบบ
      </h2>

      <p class="text-slate-400 mt-2 text-sm">
        กรุณากรอก Admin API Key
      </p>

    </div>

    <form
      onsubmit="loginAdmin(event)"
      class="space-y-4"
    >

      <div>
        <label class="block text-sm mb-2 text-slate-300">
          Admin API Key
        </label>

        <input
          id="adminKey"
          type="password"
          autocomplete="off"
          required
          class="w-full bg-slate-950 border border-slate-700
                 rounded-xl px-4 py-3 outline-none
                 focus:border-indigo-500"
          placeholder="กรอกรหัสผู้ดูแล"
        >
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500
               rounded-xl py-3 font-semibold"
      >
        เข้าสู่ระบบ
      </button>

    </form>

  </div>

</section>


<!-- =====================================================
     ADMIN APP
===================================================== -->
<main
  id="adminApp"
  class="hidden max-w-7xl mx-auto px-4 py-6"
>

  <!-- SUMMARY -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
      <div class="text-sm text-slate-400">
        สมาชิกทั้งหมด
      </div>

      <div
        id="countAll"
        class="text-3xl font-bold mt-1"
      >
        0
      </div>
    </div>

    <div class="bg-amber-950/40 border border-amber-900 rounded-xl p-4">

      <div class="text-sm text-amber-300">
        รออนุมัติ
      </div>

      <div
        id="countPending"
        class="text-3xl font-bold mt-1 text-amber-300"
      >
        0
      </div>

    </div>

    <div class="bg-emerald-950/40 border border-emerald-900 rounded-xl p-4">

      <div class="text-sm text-emerald-300">
        Active
      </div>

      <div
        id="countActive"
        class="text-3xl font-bold mt-1 text-emerald-300"
      >
        0
      </div>

    </div>

    <div class="bg-rose-950/40 border border-rose-900 rounded-xl p-4">

      <div class="text-sm text-rose-300">
        ยกเลิก
      </div>

      <div
        id="countCancelled"
        class="text-3xl font-bold mt-1 text-rose-300"
      >
        0
      </div>

    </div>

  </div>


  <!-- FILTER -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-5">

    <div class="grid md:grid-cols-4 gap-3">

      <input
        id="searchInput"
        type="text"
        placeholder="ค้นหา รหัส / ชื่อ / โทรศัพท์ / อีเมล"
        class="md:col-span-2
               bg-slate-950 border border-slate-700
               rounded-xl px-4 py-3 outline-none
               focus:border-indigo-500"
        onkeydown="if(event.key==='Enter') loadMembers()"
      >

      <select
        id="statusFilter"
        class="bg-slate-950 border border-slate-700
               rounded-xl px-4 py-3"
      >
        <option value="">ทุกสถานะ</option>
        <option value="pending">รออนุมัติ</option>
        <option value="active">ใช้งาน</option>
        <option value="cancelled">ยกเลิก</option>
      </select>

      <button
        onclick="loadMembers()"
        class="bg-indigo-600 hover:bg-indigo-500
               rounded-xl px-4 py-3 font-medium"
      >
        ค้นหา
      </button>

    </div>

  </div>


  <!-- TABLE -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">

    <div class="p-4 border-b border-slate-800 flex justify-between items-center">

      <div>
        <h2 class="font-semibold text-lg">
          รายชื่อสมาชิก
        </h2>

        <p
          id="resultText"
          class="text-sm text-slate-400"
        >
          -
        </p>
      </div>

      <button
        onclick="loadMembers()"
        class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg"
      >
        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
      </button>

    </div>


    <div class="overflow-x-auto">

      <table class="w-full text-sm">

        <thead class="bg-slate-950 text-slate-400">

          <tr>

            <th class="text-left px-4 py-3">
              รหัส
            </th>

            <th class="text-left px-4 py-3">
              ชื่อสมาชิก
            </th>

            <th class="text-left px-4 py-3">
              ติดต่อ
            </th>

            <th class="text-center px-4 py-3">
              สถานะ
            </th>

            <th class="text-center px-4 py-3">
              จัดการ
            </th>

          </tr>

        </thead>

        <tbody
          id="memberTable"
          class="divide-y divide-slate-800"
        ></tbody>

      </table>

    </div>


    <!-- PAGINATION -->
    <div class="p-4 border-t border-slate-800 flex items-center justify-between">

      <button
        id="prevBtn"
        onclick="previousPage()"
        class="px-4 py-2 rounded-lg bg-slate-800 disabled:opacity-40"
      >
        ก่อนหน้า
      </button>

      <span
        id="pageInfo"
        class="text-sm text-slate-400"
      >
        หน้า 1
      </span>

      <button
        id="nextBtn"
        onclick="nextPage()"
        class="px-4 py-2 rounded-lg bg-slate-800 disabled:opacity-40"
      >
        ถัดไป
      </button>

    </div>

  </div>

</main>


<!-- =====================================================
     MEMBER MODAL
===================================================== -->

  id="memberModal"
  class="hidden fixed inset-0 bg-black/70 z-50
         flex items-center justify-center p-4"
>

  <div class="bg-slate-900 border border-slate-700
              rounded-2xl w-full max-w-3xl shadow-2xl">

    <div class="flex justify-between items-center
                p-4 border-b border-slate-800">

      <div>

        <h3 class="text-xl font-bold">
          รายละเอียดสมาชิก
        </h3>

        <p
          id="modalMemberCode"
          class="text-sm text-slate-400"
        ></p>

      </div>

      <button
        onclick="closeMemberModal()"
        class="p-2 hover:bg-slate-800 rounded-lg"
      >
        <i data-lucide="x"></i>
      </button>

    </div>


    <div class="modal-scroll p-5">

      <form
        id="memberForm"
        class="grid md:grid-cols-2 gap-4"
      >

        <input
          id="editMemberCode"
          type="hidden"
        >


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            คำนำหน้า
          </label>

          <input
            id="editPrefix"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            ชื่อ
          </label>

          <input
            id="editFirstName"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            นามสกุล
          </label>

          <input
            id="editLastName"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            ชื่อภาษาอาหรับ
          </label>

          <input
            id="editArabicName"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            โทรศัพท์
          </label>

          <input
            id="editPhone"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            Email
          </label>

          <input
            id="editEmail"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            LINE ID
          </label>

          <input
            id="editLineId"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            ที่อยู่
          </label>

          <input
            id="editAddressLine"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            ตำบล / แขวง
          </label>

          <input
            id="editSubdistrict"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            อำเภอ / เขต
          </label>

          <input
            id="editDistrict"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            จังหวัด
          </label>

          <input
            id="editProvince"
            class="input-admin"
          >

        </div>


        <div>

          <label class="block text-sm mb-1 text-slate-400">
            รหัสไปรษณีย์
          </label>

          <input
            id="editPostalCode"
            class="input-admin"
          >

        </div>

      </form>


      <div
        id="memberStatusInfo"
        class="mt-5 p-4 bg-slate-950 rounded-xl text-sm"
      ></div>

    </div>


    <div class="p-4 border-t border-slate-800
                flex flex-wrap gap-2 justify-between">

      <div class="flex gap-2">

        <button
          onclick="approveCurrentMember()"
          class="px-4 py-2 rounded-lg
                 bg-emerald-700 hover:bg-emerald-600"
        >
          อนุมัติสมาชิก
        </button>

        <button
          onclick="cancelCurrentMember()"
          class="px-4 py-2 rounded-lg
                 bg-rose-800 hover:bg-rose-700"
        >
          ยกเลิกสมาชิก
        </button>

      </div>

      <div class="flex gap-2">

        <button
          onclick="closeMemberModal()"
          class="px-4 py-2 rounded-lg bg-slate-800"
        >
          ปิด
        </button>

        <button
          onclick="saveMember()"
          class="px-4 py-2 rounded-lg
                 bg-indigo-600 hover:bg-indigo-500"
        >
          บันทึกแก้ไข
        </button>

      </div>

    </div>

  </div>

</div>


<script>

const API_BASE =
  "https://sk-alumni-api.itpcmc2024.workers.dev";

const LIMIT = 20;

let offset = 0;
let total = 0;


// =====================================================
// STYLE INPUT
// =====================================================

document.addEventListener("DOMContentLoaded", () => {

  document
    .querySelectorAll(".input-admin")
    .forEach(input => {

      input.className =
        "input-admin w-full bg-slate-950 border border-slate-700 " +
        "rounded-xl px-4 py-3 outline-none focus:border-indigo-500";

    });

  lucide.createIcons();

  const savedKey =
    sessionStorage.getItem("SK_ADMIN_KEY");

  if (savedKey) {
    checkExistingLogin();
  }

});


// =====================================================
// API
// =====================================================

async function apiRequest(
  path,
  options = {},
  admin = true
) {

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (admin) {

    const key =
      sessionStorage.getItem("SK_ADMIN_KEY");

    if (key) {
      headers.Authorization =
        `Bearer ${key}`;
    }

  }

  const response = await fetch(
    `${API_BASE}${path}`,
    {
      ...options,
      headers
    }
  );

  let data;

  try {

    data = await response.json();

  } catch {

    throw new Error(
      "ไม่สามารถอ่านข้อมูลจาก API ได้"
    );

  }

  if (!response.ok) {

    throw new Error(
      data.message ||
      "เกิดข้อผิดพลาด"
    );

  }

  return data;
}


// =====================================================
// LOGIN
// =====================================================

async function loginAdmin(event) {

  event.preventDefault();

  const key =
    document
      .getElementById("adminKey")
      .value
      .trim();

  if (!key) return;

  sessionStorage.setItem(
    "SK_ADMIN_KEY",
    key
  );

  try {

    await apiRequest(
      "/api/admin/check"
    );

    openAdmin();

  } catch (error) {

    sessionStorage.removeItem(
      "SK_ADMIN_KEY"
    );

    Swal.fire({
      icon: "error",
      title: "เข้าสู่ระบบไม่ได้",
      text: error.message
    });

  }

}


async function checkExistingLogin() {

  try {

    await apiRequest(
      "/api/admin/check"
    );

    openAdmin();

  } catch {

    sessionStorage.removeItem(
      "SK_ADMIN_KEY"
    );

  }

}


function openAdmin() {

  document
    .getElementById("loginSection")
    .classList
    .add("hidden");

  document
    .getElementById("adminApp")
    .classList
    .remove("hidden");

  document
    .getElementById("adminStatus")
    .classList
    .remove("hidden");

  loadMembers();

}


function logoutAdmin() {

  sessionStorage.removeItem(
    "SK_ADMIN_KEY"
  );

  location.reload();

}


// =====================================================
// MEMBER LIST
// =====================================================

async function loadMembers() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim();

  const status =
    document
      .getElementById("statusFilter")
      .value;

  const params =
    new URLSearchParams();

  params.set(
    "limit",
    LIMIT
  );

  params.set(
    "offset",
    offset
  );

  if (search) {
    params.set(
      "search",
      search
    );
  }

  if (status) {
    params.set(
      "status",
      status
    );
  }

  try {

    const result =
      await apiRequest(
        `/api/admin/members?${params.toString()}`
      );

    total = result.total || 0;

    renderMembers(
      result.data || []
    );

    updatePagination();

    await loadSummary();

  } catch (error) {

    Swal.fire({
      icon: "error",
      title: "โหลดข้อมูลไม่สำเร็จ",
      text: error.message
    });

  }

}


function renderMembers(rows) {

  const tbody =
    document
      .getElementById("memberTable");

  tbody.innerHTML = "";

  if (!rows.length) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="5"
          class="text-center text-slate-500 py-10"
        >
          ไม่พบข้อมูลสมาชิก
        </td>
      </tr>
    `;

    return;

  }

  for (const row of rows) {

    const tr =
      document.createElement("tr");

    tr.className =
      "hover:bg-slate-800/60";

    tr.innerHTML = `

      <td class="px-4 py-3 whitespace-nowrap">
        ${safe(row.member_code)}
      </td>

      <td class="px-4 py-3">

        <div class="font-medium">
          ${safe(row.full_name)}
        </div>

        <div class="text-xs text-slate-500">
          ${safe(row.arabic_name || "")}
        </div>

      </td>

      <td class="px-4 py-3">

        <div>
          ${safe(row.phone || "-")}
        </div>

        <div class="text-xs text-slate-500">
          ${safe(row.email || "-")}
        </div>

      </td>

      <td class="px-4 py-3 text-center">
        ${statusBadge(row.status)}
      </td>

      <td class="px-4 py-3 text-center">

        <button
          onclick="openMember('${safeAttribute(row.member_code)}')"
          class="px-3 py-2 rounded-lg
                 bg-indigo-950 hover:bg-indigo-900
                 text-indigo-300 text-xs"
        >
          ดู / แก้ไข
        </button>

      </td>
    `;

    tbody.appendChild(tr);

  }

}


function statusBadge(status) {

  if (status === "active") {

    return `
      <span class="px-2 py-1 rounded-full
                   bg-emerald-950 text-emerald-300
                   border border-emerald-800 text-xs">
        ใช้งาน
      </span>
    `;

  }

  if (status === "pending") {

    return `
      <span class="px-2 py-1 rounded-full
                   bg-amber-950 text-amber-300
                   border border-amber-800 text-xs">
        รออนุมัติ
      </span>
    `;

  }

  if (status === "cancelled") {

    return `
      <span class="px-2 py-1 rounded-full
                   bg-rose-950 text-rose-300
                   border border-rose-800 text-xs">
        ยกเลิก
      </span>
    `;

  }

  return `
    <span class="px-2 py-1 rounded-full
                 bg-slate-800 text-slate-300 text-xs">
      ${safe(status || "-")}
    </span>
  `;

}


// =====================================================
// SUMMARY
// =====================================================

async function loadSummary() {

  try {

    const all =
      await apiRequest(
        "/api/admin/members?limit=100&offset=0"
      );

    const rows =
      all.data || [];

    document
      .getElementById("countAll")
      .textContent =
      all.total || rows.length;

    document
      .getElementById("countPending")
      .textContent =
      rows.filter(
        x => x.status === "pending"
      ).length;

    document
      .getElementById("countActive")
      .textContent =
      rows.filter(
        x => x.status === "active"
      ).length;

    document
      .getElementById("countCancelled")
      .textContent =
      rows.filter(
        x => x.status === "cancelled"
      ).length;

  } catch {}

}


// =====================================================
// PAGINATION
// =====================================================

function updatePagination() {

  const currentPage =
    Math.floor(
      offset / LIMIT
    ) + 1;

  const totalPages =
    Math.max(
      Math.ceil(total / LIMIT),
      1
    );

  document
    .getElementById("resultText")
    .textContent =
    `ทั้งหมด ${total} รายการ`;

  document
    .getElementById("pageInfo")
    .textContent =
    `หน้า ${currentPage} / ${totalPages}`;

  document
    .getElementById("prevBtn")
    .disabled =
    offset <= 0;

  document
    .getElementById("nextBtn")
    .disabled =
    offset + LIMIT >= total;

}


function previousPage() {

  offset =
    Math.max(
      offset - LIMIT,
      0
    );

  loadMembers();

}


function nextPage() {

  if (
    offset + LIMIT < total
  ) {

    offset += LIMIT;

    loadMembers();

  }

}


// =====================================================
// MEMBER DETAIL
// =====================================================

async function openMember(
  memberCode
) {

  try {

    Swal.fire({
      title: "กำลังโหลด...",
      allowOutsideClick: false,
      didOpen: () => {
        Swal.showLoading();
      }
    });

    const result =
      await apiRequest(
        `/api/admin/members/${encodeURIComponent(memberCode)}`
      );

    Swal.close();

    const m =
      result.data;

    setValue(
      "editMemberCode",
      m.member_code
    );

    setValue(
      "editPrefix",
      m.prefix
    );

    setValue(
      "editFirstName",
      m.first_name
    );

    setValue(
      "editLastName",
      m.last_name
    );

    setValue(
      "editArabicName",
      m.arabic_name
    );

    setValue(
      "editPhone",
      m.phone
    );

    setValue(
      "editEmail",
      m.email
    );

    setValue(
      "editLineId",
      m.line_id
    );

    setValue(
      "editAddressLine",
      m.address_line
    );

    setValue(
      "editSubdistrict",
      m.subdistrict
    );

    setValue(
      "editDistrict",
      m.district
    );

    setValue(
      "editProvince",
      m.province
    );

    setValue(
      "editPostalCode",
      m.postal_code
    );

    document
      .getElementById("modalMemberCode")
      .textContent =
      m.member_code;

    document
      .getElementById("memberStatusInfo")
      .innerHTML = `

        <div class="grid md:grid-cols-3 gap-3">

          <div>
            <span class="text-slate-500">
              สถานะ
            </span>

            <div class="mt-1">
              ${statusBadge(m.status)}
            </div>
          </div>

          <div>
            <span class="text-slate-500">
              เริ่มสมาชิก
            </span>

            <div class="mt-1">
              ${formatDate(m.member_start)}
            </div>
          </div>

          <div>
            <span class="text-slate-500">
              หมดอายุ
            </span>

            <div class="mt-1">
              ${formatDate(m.member_expire)}
            </div>
          </div>

        </div>
      `;

    document
      .getElementById("memberModal")
      .classList
      .remove("hidden");

    lucide.createIcons();

  } catch (error) {

    Swal.fire({
      icon: "error",
      title: "เกิดข้อผิดพลาด",
      text: error.message
    });

  }

}


function closeMemberModal() {

  document
    .getElementById("memberModal")
    .classList
    .add("hidden");

}


// =====================================================
// SAVE MEMBER
// =====================================================

async function saveMember() {

  const code =
    getValue(
      "editMemberCode"
    );

  if (!code) return;

  const confirmed =
    await Swal.fire({
      icon: "question",
      title: "บันทึกการแก้ไข?",
      showCancelButton: true,
      confirmButtonText: "บันทึก",
      cancelButtonText: "ยกเลิก"
    });

  if (!confirmed.isConfirmed) {
    return;
  }

  try {

    await apiRequest(
      `/api/admin/members/${encodeURIComponent(code)}`,
      {
        method: "PATCH",

        body: JSON.stringify({

          prefix:
            getValue("editPrefix"),

          first_name:
            getValue("editFirstName"),

          last_name:
            getValue("editLastName"),

          arabic_name:
            getValue("editArabicName"),

          phone:
            getValue("editPhone"),

          email:
            getValue("editEmail"),

          line_id:
            getValue("editLineId"),

          address_line:
            getValue("editAddressLine"),

          subdistrict:
            getValue("editSubdistrict"),

          district:
            getValue("editDistrict"),

          province:
            getValue("editProvince"),

          postal_code:
            getValue("editPostalCode")

        })
      }
    );

    await Swal.fire({
      icon: "success",
      title: "บันทึกเรียบร้อย"
    });

    closeMemberModal();

    loadMembers();

  } catch (error) {

    Swal.fire({
      icon: "error",
      title: "บันทึกไม่สำเร็จ",
      text: error.message
    });

  }

}

// =====================================================
// UTILS
// =====================================================

function setValue(
  id,
  value
) {

  document
    .getElementById(id)
    .value =
    value ?? "";

}


function getValue(id) {

  const value =
    document
      .getElementById(id)
      .value
      .trim();

  return value || null;

}


function formatDate(value) {

  if (!value) {
    return "-";
  }

  try {

    return new Date(value)
      .toLocaleDateString(
        "th-TH",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

  } catch {

    return value;

  }

}


function safe(value) {

  return String(
    value ?? ""
  )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function safeAttribute(value) {

  return safe(value)
    .replaceAll(
      "`",
      "&#096;"
    );

}
