@import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#edf8f2;color:#29483e;font-family:'Noto Sans Thai',sans-serif}.actions{width:210mm;max-width:94vw;margin:12px auto;display:flex;justify-content:flex-end;gap:8px}.btn{border:1px solid #cfe4d9;border-radius:10px;padding:9px 14px;background:#fff;color:#08744c;font-weight:800;cursor:pointer}.primary{background:#08744c;color:#fff}.a4{width:210mm;height:297mm;margin:0 auto 24px;background:#fff;padding:7mm 11mm;box-shadow:0 12px 40px #2342;overflow:hidden}.copy{height:138mm;position:relative;padding:4mm 3.5mm 3mm}.cut{height:7mm;border-top:1px dashed #96b4a5;display:flex;align-items:center;justify-content:center;color:#8aa094;font-size:10px}.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:600 52px Mitr,sans-serif;color:rgba(8,116,76,.05);transform:rotate(-24deg);white-space:nowrap}.head{display:grid;grid-template-columns:70px 1fr 110px;gap:12px;align-items:center;border-bottom:2px solid #08744c;padding-bottom:7px}.logo{width:66px;height:66px;object-fit:contain}.org h1{font:600 16px Mitr,sans-serif;color:#08744c;margin:0}.org p{font-size:10px;color:#667b71;margin:3px 0 0;line-height:1.35}.doctype{text-align:right;white-space:nowrap}.doctype b{font:600 19px Mitr;color:#08744c;white-space:nowrap}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}.box{border:1px solid #d6e9df;background:#f7fcf9;border-radius:8px;padding:5px 8px;font-size:10.5px}.box small,.cell small{display:block;color:#7a8b83;font-weight:700}.payer{display:grid;grid-template-columns:1.2fr .8fr .8fr 1.2fr;gap:6px;border:1px solid #d6e9df;border-radius:9px;padding:6px 7px;margin-bottom:7px}.cell{font-size:10.5px;min-width:0}.addr{grid-column:1/-1}.items{width:100%;border-collapse:collapse;font-size:10.5px}.items th,.items td{border:1px solid #d6e9df;padding:5px 7px}.items th{background:#edf8f2;text-align:left}.items th:last-child,.items td:last-child{text-align:right;width:90px}.total{display:grid;grid-template-columns:minmax(0,1fr) auto 150px;gap:9px;margin-top:6px;align-items:stretch}.wordsbox,.totalbox{border:1px solid #d6e9df;background:#f7fcf9;border-radius:8px;padding:7px 9px;display:flex;align-items:center}.wordsrow{display:grid;grid-template-columns:68px minmax(0,1fr);align-items:stretch;gap:8px;min-width:0}.wordslabel{display:flex;align-items:center;font-weight:900;color:#31564b;font-size:13px;white-space:nowrap}.wordsbox{font:600 16px Mitr,sans-serif;color:#08744c;min-width:0;width:100%}.totalbox{font-size:10.5px}.totallabel{display:flex;align-items:center;font-weight:900;color:#31564b;font-size:13px;white-space:nowrap}.trow{display:flex;width:100%;justify-content:flex-end;align-items:center}.trow strong{color:#08744c;font:600 16px Mitr}.bankline{font-size:10px;margin-top:5px;color:#6d7f76}.payment-note{margin-left:76px}.verifyinfo{margin-left:76px}.verify{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:5px;font-size:9.5px;min-height:46px}.sigwrap{position:relative;text-align:center;padding-top:38px;min-height:72px}.sigline{position:relative;z-index:2}.sigline:before{content:'';display:block;width:155px;border-top:1px solid #8ba096;margin:0 auto 3px}.stamp{position:absolute;width:108px;height:108px;object-fit:contain;opacity:.52;left:50%;top:50%;transform:translate(-50%,-55%);filter:saturate(.85)}.stamp:after{content:'SK';position:absolute;font:600 26px Mitr;color:rgba(8,116,76,.12)}.foot{position:absolute;left:3.5mm;right:3.5mm;bottom:.5mm;display:flex;justify-content:space-between;gap:8px;font-size:8px;color:#809188}.printmeta{font-weight:700;color:#526b60}@media(max-width:850px){.a4{width:94vw;height:auto;min-height:0}.copy{height:auto;min-height:650px}.actions{width:94vw}.payer{grid-template-columns:1fr 1fr}.head{grid-template-columns:60px 1fr 92px}.logo{width:56px;height:56px}}@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.actions{display:none}.a4{width:210mm;height:297mm;margin:0;padding:7mm 11mm;box-shadow:none;page-break-after:always}.copy{height:138mm}.cut{height:7mm}}
</style><script defer src="assets/ui-feedback.js?v=2.6.59"></script></head><body><div class="actions"><button class="btn" onclick="window.close()">ปิด</button><button class="btn primary" id="printBtn">🖨 พิมพ์ต้นฉบับ + สำเนา</button></div><main id="a4" class="a4" hidden><section id="original" class="copy"></section><div class="cut">✂ ตัดตามเส้น — ต้นฉบับ / สำเนา</div><section id="copy" class="copy"></section></main><script>
const API=SK.API,$=x=>document.getElementById(x),params=new URLSearchParams(location.search),id=params.get('id'),sourceType=params.get('type')==='donation'?'donation':'payment',key=localStorage.getItem('sk_alumni_admin_key')||sessionStorage.getItem('sk_alumni_admin_key')||localStorage.getItem('SK_ALUMNI_ADMIN_KEY')||sessionStorage.getItem('SK_ALUMNI_ADMIN_KEY')||'';let D=null,printCount=0;const esc=e;function money(v){return Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาท'}function fmt(v,sec=false){if(!v)return'-';return new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(v))+' น.'}function addr(d){return [d.address_line,d.subdistrict&&'ต.'+d.subdistrict,d.district&&'อ.'+d.district,d.province&&'จ.'+d.province,d.postal_code].filter(Boolean).join(' ')||'-'}
function thaiInt(n){const d=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],u=['','สิบ','ร้อย','พัน','หมื่น','แสน'];n=Math.floor(Number(n)||0);if(n===0)return d[0];function six(x){let out='';const s=String(x).padStart(6,'0');for(let i=0;i<6;i++){const k=Number(s[i]);if(!k)continue;const pos=5-i;if(pos===1){if(k===1)out+='สิบ';else if(k===2)out+='ยี่สิบ';else out+=d[k]+'สิบ'}else if(pos===0){out+=(k===1&&out?'เอ็ด':d[k])}else out+=d[k]+u[pos]}return out}if(n>=1000000){const hi=Math.floor(n/1000000),lo=n%1000000;return thaiInt(hi)+'ล้าน'+(lo?six(lo):'')}return six(n)}
function bahtText(n){const v=Math.round(Number(n||0)*100);if(!Number.isFinite(v))return'-';const baht=Math.floor(v/100),sat=v%100;return thaiInt(baht)+'บาท'+(sat?thaiInt(sat)+'สตางค์':'ถ้วน')}
async function req(path,opt={}){const r=await fetch(API+path,{cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||'HTTP '+r.status);return j}
function tpl(label,d,count){const st=d.settings||{},name=[d.prefix,d.first_name,d.last_name].filter(Boolean).join(' ')||d.full_name||'-',associationAddress=st.ASSOCIATION_ADDRESS||'-';return `<div class="wm">ใบเสร็จรับเงิน</div><div class="head"><img class="logo" src="assets/association-logo.png"><div class="org"><h1>สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</h1><p>${esc(associationAddress)}</p></div><div class="doctype"><b>${esc(label)}</b></div></div><div class="meta"><div class="box"><small>เลขที่ใบเสร็จ</small>${esc(d.receipt_no||'-')}</div><div class="box"><small>วันที่ออกใบเสร็จ</small>${esc(fmt(d.receipt_issued_at,true))}</div></div><div class="payer"><div class="cell"><small>ได้รับเงินจาก</small>${esc(name)}</div><div class="cell"><small>รหัสสมาชิก</small>${esc(d.member_code||'-')}</div><div class="cell"><small>โทรศัพท์</small>${esc(d.phone||'-')}</div><div class="cell"><small>อีเมล</small>${esc(d.email||'-')}</div><div class="cell addr"><small>ที่อยู่</small>${esc(addr(d))}</div></div><table class="items"><thead><tr><th>รายการ</th><th>รายละเอียด / อ้างอิง</th><th>จำนวนเงิน</th></tr></thead><tbody><tr><td>${esc(d.source_type==='donation'?(d.donation_type||'เงินบริจาค'):(d.payment_type||'ค่าบำรุงสมาคมศิษย์เก่าฯ รายปี'))}</td><td>${esc(d.transaction_id||d.payment_id||d.donation_id||'-')} · โอน ${esc(fmt((d.paid_at||d.donated_at),true))}</td><td>${esc(money(d.amount))}</td></tr></tbody></table><div class="total"><div class="wordsrow"><div class="wordslabel">จำนวนเงิน</div><div class="wordsbox">${esc(bahtText(d.amount))}</div></div><div class="totallabel">รวมเงิน</div><div class="totalbox"><div class="trow"><strong>${esc(Number(d.amount||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}))}</strong></div></div></div><div class="bankline payment-note">รับชำระผ่าน ${esc([st.BANK_NAME,st.BANK_ACCOUNT_NO,st.BANK_ACCOUNT_NAME].filter(Boolean).join(' · ')||'PromptPay')}</div><div class="verify"><div class="bankline verifyinfo">ตรวจสอบโดย: <b>${esc(d.verified_by||'admin')}</b><br>ตรวจเมื่อ: ${esc(fmt(d.verified_at,true))}</div><div class="sigwrap"><img class="stamp" src="${esc(st.ASSOCIATION_STAMP||'assets/association-logo.png')}" alt="ตราสมาคม"><div class="sigline">ผู้รับเงิน / เจ้าหน้าที่สมาคมฯ</div></div></div><div class="foot"><span>© 2026 SK Alumni Member System by Kimhan · Receipt V2.6.59</span><span class="printmeta">${count>0?'พิมพ์ครั้งที่ '+count:'ยังไม่ได้พิมพ์'} · วันที่พิมพ์ ${esc(fmt(new Date(),true))}</span></div>`}
function paint(){original.innerHTML=tpl('ต้นฉบับ',D,printCount);copy.innerHTML=tpl('สำเนา',D,printCount);a4.hidden=false}
async function render(){const endpoint=sourceType==='donation'?'/api/admin/donations/'+encodeURIComponent(id)+'/receipt':'/api/admin/payments/'+encodeURIComponent(id)+'/receipt';const j=await req(endpoint,{headers:{Authorization:'Bearer '+key}});D=j.data;const logs=await req('/api/admin/receipt-print-logs',{headers:{Authorization:'Bearer '+key}}).catch(()=>({data:[]}));printCount=(logs.data||[]).filter(x=>(x.transaction_id||x.payment_id)===id&&(x.source_type||'payment')===sourceType).length;paint()}
async function logPrint(){await req('/api/admin/receipt-print-logs',{method:'POST',headers:{Authorization:'Bearer '+key},body:JSON.stringify({items:[{source_type:sourceType,transaction_id:id}],print_type:'single-original-copy',printed_by:'admin',user_agent:navigator.userAgent})})}
printBtn.onclick=async()=>{try{await logPrint();printCount+=1;paint();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));window.print()}catch(e){const ok=await Swal.fire({icon:'warning',title:'บันทึก Log ไม่สำเร็จ',text:e.message,showCancelButton:true,confirmButtonText:'พิมพ์โดยไม่บันทึก Log',cancelButtonText:'ยกเลิก'});if(ok.isConfirmed)window.print()}};if(!id||!key)Swal.fire({icon:'warning',title:'ไม่พบข้อมูลหรือ Admin Key'});else render().catch(err=>Swal.fire({icon:'error',title:'เปิดใบเสร็จไม่สำเร็จ',text:err.message}));
</script></body></html>
