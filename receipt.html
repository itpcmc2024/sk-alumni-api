<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ใบเสร็จรับเงิน | SK Alumni</title><style>

dth:0}.addr{grid-column:1/-1}.items{width:100%;border-collapse:collapse;font-size:10.5px}.items th,.items td{border:1px solid #d6e9df;padding:5px 7px}.items th{background:#edf8f2;text-align:left}.items th:last-child,.items td:last-child{text-align:right;width:90px}.total{display:grid;grid-template-columns:minmax(0,1fr) auto 150px;gap:9px;margin-top:6px;align-items:stretch}.wordsbox,.totalbox{border:1px solid #d6e9df;background:#f7fcf9;border-radius:8px;padding:7px 9px;display:flex;align-items:center}.wordsrow{display:grid;grid-template-columns:68px minmax(0,1fr);gap:8px}.wordslabel,.totallabel{display:flex;align-items:center;font-weight:900;color:#31564b;font-size:13px;white-space:nowrap}.wordsbox{font:600 16px Mitr;color:#08744c}.trow{display:flex;width:100%;justify-content:flex-end;align-items:center}.trow strong{color:#08744c;font:600 16px Mitr}.bankline{font-size:10px;margin-top:5px;color:#6d7f76}.payment-note,.verifyinfo{margin-left:76px}.verify{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:5px;font-size:9.5px;min-height:46px}.sigwrap{position:relative;text-align:center;padding-top:38px;min-height:72px}.sigline:before{content:'';display:block;width:155px;border-top:1px solid #8ba096;margin:0 auto 3px}.stamp{position:absolute;width:108px;height:108px;object-fit:contain;opacity:.52;left:50%;top:50%;transform:translate(-50%,-55%)}.foot{position:absolute;left:3.5mm;right:3.5mm;bottom:.5mm;display:flex;justify-content:space-between;gap:8px;font-size:8px;color:#809188}.printmeta{font-weight:700;color:#526b60}@media(max-width:850px){.a4{width:94vw;height:auto;min-height:0}.copy{height:auto;min-height:650px}.actions{width:94vw}.payer{grid-template-columns:1fr 1fr}.head{grid-template-columns:60px 1fr 92px}.logo{width:56px;height:56px}}@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.actions,.state{display:none!important}.a4{width:210mm;height:297mm;margin:0;padding:7mm 11mm;box-shadow:none}.copy{height:138mm}.cut{height:7mm}}
</style><link rel="stylesheet" href="assets/responsive-v2682.css?v=2.6.82"></head><body><div id="state" class="state">กำลังโหลดใบเสร็จ...</div><div id="actions" class="actions" hidden><button class="btn" onclick="window.close()">ปิด</button><button class="btn primary" id="printBtn">🖨 พิมพ์ต้นฉบับ + สำเนา</button></div><main id="a4" class="a4" hidden><section id="original" class="copy"></section><div class="cut">✂ ตัดตามเส้น — ต้นฉบับ / สำเนา</div><section id="copy" class="copy"></section></main><script>
'use strict';
const API='https://sk-alumni-api.itpcmc2024.workers.dev',params=new URLSearchParams(location.search),id=params.get('id'),sourceType=params.get('type')==='donation'?'donation':'payment',state=document.getElementById('state'),a4=document.getElementById('a4'),actions=document.getElementById('actions'),original=document.getElementById('original'),copy=document.getElementById('copy'),printBtn=document.getElementById('printBtn');let D=null,printCount=0;
function getAdminKey(){const names=['sk_alumni_admin_key','SK_ALUMNI_ADMIN_KEY','adminKey'];for(const n of names){const v=sessionStorage.getItem(n);if(v)return v}try{if(window.opener&&!window.opener.closed){for(const n of names){const v=window.opener.sessionStorage.getItem(n);if(v){sessionStorage.setItem('sk_alumni_admin_key',v);return v}}}}catch(_){}return''}const key=getAdminKey();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function money(v){return Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาท'}function fmt(v){if(!v)return'-';try{return new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(v))+' น.'}catch{return String(v)}}function addr(d){return [d.address_line,d.subdistrict&&'ต.'+d.subdistrict,d.district&&'อ.'+d.district,d.province&&'จ.'+d.province,d.postal_code].filter(Boolean).join(' ')||'-'}
function thaiInt(n){const d=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],u=['','สิบ','ร้อย','พัน','หมื่น','แสน'];n=Math.floor(Number(n)||0);if(n===0)return d[0];function six(x){let out='',z=String(x).padStart(6,'0');for(let i=0;i<6;i++){let k=Number(z[i]);if(!k)continue;let pos=5-i;if(pos===1){if(k===1)out+='สิบ';else if(k===2)out+='ยี่สิบ';else out+=d[k]+'สิบ'}else if(pos===0)out+=(k===1&&out?'เอ็ด':d[k]);else out+=d[k]+u[pos]}return out}if(n>=1000000){const hi=Math.floor(n/1000000),lo=n%1000000;return thaiInt(hi)+'ล้าน'+(lo?six(lo):'')}return six(n)}function bahtText(n){const v=Math.round(Number(n||0)*100),b=Math.floor(v/100),sat=v%100;return thaiInt(b)+'บาท'+(sat?thaiInt(sat)+'สตางค์':'ถ้วน')}
async function req(path,opt={}){const r=await fetch(API+path,{cache:'no-store',...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+key,'X-Admin-Key':key,...(opt.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok||j.success===false)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
function tpl(label,d,count){const st=d.settings||{},name=[d.prefix,d.first_name,d.last_name].filter(Boolean).join(' ')||d.full_name||d.donor_name||'-',item=d.source_type==='donation'?('บริจาคเพื่อ '+(d.donation_type||'กิจกรรมสมาคม')):'ชำระค่าบำรุงสมาคมฯ';return `<div class="wm">ใบเสร็จรับเงิน</div><div class="head"><img class="logo" src="assets/association-logo.png"><div class="org"><h1>สมาคมศิษย์เก่านูรุ้ลอิสลามสัมพันธ์ (สุเหร่าเขียว)</h1><p>${esc(st.ASSOCIATION_ADDRESS||'-')}</p></div><div class="doctype"><b>${esc(label)}</b></div></div><div class="meta"><div class="box"><small>เลขที่ใบเสร็จ</small>${esc(d.receipt_no||'-')}</div><div class="box"><small>วันที่ออกใบเสร็จ</small>${esc(fmt(d.receipt_issued_at))}</div></div><div class="payer"><div class="cell"><small>ได้รับเงินจาก</small>${esc(name)}</div><div class="cell"><small>รหัสสมาชิก</small>${esc(d.member_code||'-')}</div><div class="cell"><small>โทรศัพท์</small>${esc(d.phone||'-')}</div><div class="cell"><small>อีเมล</small>${esc(d.email||'-')}</div><div class="cell addr"><small>ที่อยู่</small>${esc(addr(d))}</div></div><table class="items"><thead><tr><th>รายการ</th><th>รายละเอียด / อ้างอิง</th><th>จำนวนเงิน</th></tr></thead><tbody><tr><td>${esc(item)}</td><td>${esc(d.transaction_id||d.payment_id||d.donation_id||'-')} · โอน ${esc(fmt(d.paid_at||d.donated_at))}</td><td>${esc(money(d.amount))}</td></tr></tbody></table><div class="total"><div class="wordsrow"><div class="wordslabel">จำนวนเงิน</div><div class="wordsbox">${esc(bahtText(d.amount))}</div></div><div class="totallabel">รวมเงิน</div><div class="totalbox"><div class="trow"><strong>${esc(Number(d.amount||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}))}</strong></div></div></div><div class="bankline payment-note">รับชำระผ่าน ${esc([st.BANK_NAME,st.BANK_ACCOUNT_NO,st.BANK_ACCOUNT_NAME].filter(Boolean).join(' · ')||'PromptPay')}</div><div class="verify"><div class="bankline verifyinfo">ตรวจสอบโดย: <b>${esc(d.verified_by||'admin')}</b><br>ตรวจเมื่อ: ${esc(fmt(d.verified_at))}</div><div class="sigwrap"><img class="stamp" src="${esc(st.ASSOCIATION_STAMP||'assets/association-logo.png')}" alt="ตราสมาคม"><div class="sigline">ผู้รับเงิน / เจ้าหน้าที่สมาคมฯ</div></div></div><div class="foot"><span>© 2026 SK Alumni Member System by Kimhan · Receipt V2.6.82</span><span class="printmeta">${count>0?'พิมพ์ครั้งที่ '+count:'ยังไม่ได้พิมพ์'} · วันที่พิมพ์ ${esc(fmt(new Date()))}</span></div>`}
function showError(msg){state.className='state err';state.innerHTML='<b>เปิดใบเสร็จไม่สำเร็จ</b><br><span style="font-weight:500">'+esc(msg)+'</span><div style="margin-top:12px"><button class="btn" onclick="location.reload()">รีเฟรช</button></div>'}
function paint(){original.innerHTML=tpl('ต้นฉบับ',D,printCount);copy.innerHTML=tpl('สำเนา',D,printCount);state.hidden=true;a4.hidden=false;actions.hidden=false}
async function render(){if(!id)throw new Error('ไม่พบรหัสรายการใบเสร็จ');if(!key)throw new Error('ไม่พบ Admin Session กรุณาปิดหน้านี้ แล้วเปิดใบเสร็จจากโมดูล Admin อีกครั้ง');const ep=sourceType==='donation'?'/api/admin/donations/'+encodeURIComponent(id)+'/receipt':'/api/admin/payments/'+encodeURIComponent(id)+'/receipt';const j=await req(ep);D=j.data;if(!D)throw new Error('API ไม่ส่งข้อมูลใบเสร็จกลับมา');try{const l=await req('/api/admin/receipt-print-logs');printCount=(l.data||[]).filter(x=>(x.transaction_id||x.payment_id)===id&&(x.source_type||'payment')===sourceType).length}catch(_){}paint();if(params.get('print')==='1')setTimeout(()=>window.print(),250)}
printBtn.addEventListener('click',async()=>{try{await req('/api/admin/receipt-print-logs',{method:'POST',body:JSON.stringify({items:[{source_type:sourceType,transaction_id:id}],print_type:'single-original-copy',printed_by:'admin',user_agent:navigator.userAgent})});printCount++;paint()}catch(e){console.warn('print log',e)}window.print()});
render().catch(e=>showError(e.message||String(e)));
</script></body></html>
