<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Benefits</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="assets/site.js"></script></head><body><header class="top"><div class="wrap topin"><img class="logo" src="assets/association-logo.jpg"><div><div class="brand">จัดการสิทธิประโยชน์</div><div class="brand-sub">Admin · V2.0</div></div><nav class="nav"><a href="admin-home.html">Admin Center</a></nav></div></header><main class="wrap"><div class="card" style="margin-top:28px"><form id="f" class="form"><div class="field"><label>Admin API Key *</label><input id="key" class="control" type="password" required></div><div class="field"><label>ชื่อสิทธิประโยชน์ *</label><input id="title" class="control" required></div><div class="field"><label>รายละเอียด</label><textarea id="desc" class="control"></textarea></div><div class="row2"><div class="field"><label>เริ่ม</label><input id="start" type="date" class="control"></div><div class="field"><label>สิ้นสุด</label><input id="end" type="date" class="control"></div></div><button class="btn">เพิ่มสิทธิประโยชน์</button></form></div><h2 class="section-title">สิทธิที่เปิดใช้งาน</h2><div id="list" class="list"></div></main><div id="foot"></div><script>foot.innerHTML=footer('Admin Benefits');async function refresh(){try{const j=await api('/api/benefits');list.innerHTML=(j.data||[]).map(x=>`<div class="item"><b>${e(x.title)}</b><div>${e(x.description||'')}</div></div>`).join('')||'<div class="item">ยังไม่มีรายการ</div>'}catch(err){list.innerHTML='<div class="item">'+e(err.message)+'</div>'}}f.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/benefits',{method:'POST',headers:{Authorization:'Bearer '+key.value.trim()},body:JSON.stringify({title:title.value.trim(),description:desc.value.trim(),start_date:start.value||null,end_date:end.value||null})});Swal.fire({icon:'success',title:'บันทึกแล้ว',timer:900,showConfirmButton:false});ev.target.reset();refresh()}catch(err){Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:err.message})}};refresh();</script></body></html>
